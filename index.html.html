  }

  // ---- direction & numbers ----
  ctx.font = font(12); ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = PALETTE.muted;
  ctx.fillText(`n ${fmt(S.speed, 2)} ${unit('rpm')}`, 10, 10);
  ctx.fillText(`f ${fmt(sig.frequency, 2)} ${unit('Hz')}`, 10, 26);
  ctx.textAlign = 'right';
  ctx.fillText(`2p = ${2 * p}`, W - 10, 10);
  if (Math.abs(S.speed) > 0.05) {
    const dir = Math.sign(S.speed), R = r * 1.04, a0 = -Math.PI / 2 - 0.5, a1 = -Math.PI / 2 - 0.15;
    ctx.strokeStyle = PALETTE.muted; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, R, dir > 0 ? a1 : a0, dir > 0 ? a0 : a1, dir > 0); ctx.stroke();
    const end = dir > 0 ? a0 : a1, tx = cx + Math.cos(end) * R, ty = cy + Math.sin(end) * R;
    const tangent = end + (dir > 0 ? -Math.PI / 2 : Math.PI / 2);
    ctx.fillStyle = PALETTE.muted; ctx.beginPath(); ctx.moveTo(tx + Math.cos(tangent) * 6, ty + Math.sin(tangent) * 6);
    ctx.lineTo(tx + Math.cos(tangent + 2.5) * 6, ty + Math.sin(tangent + 2.5) * 6); ctx.lineTo(tx + Math.cos(tangent - 2.5) * 6, ty + Math.sin(tangent - 2.5) * 6); ctx.closePath(); ctx.fill();
  }
}

/* ==========================================================================
 * vectors.js — phase, Clarke, Park and resultant current vectors in the
 * stationary electrical frame (α to the right, β up), plus the cos φ gauge.
 * ========================================================================== */

const vectorHits = [];

function drawVector(ctx, cx, cy, scale, x, y, color, label, key, width) {
  if (Math.hypot(x, y) * scale < 2) return;
  const ex = cx + x * scale, ey = cy - y * scale;
  arrow(ctx, cx, cy, ex, ey, color, width || 2.5);
  ctx.fillStyle = color; ctx.font = font(12, 600); ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText(label, ex + 4, ey - 3);
  if (key) addHit(vectorHits, cx, cy, ex, ey, key);
}

function drawAngleMarkers(ctx, cx, cy, r, S) {
  const sig = S.signals, theta = wrap(S.poles * S.angle, TWO_PI), mag = Math.hypot(sig.alpha, sig.beta);
  const current = mag > 1e-8 ? Math.atan2(sig.beta, sig.alpha) : theta, delta = wrapPi(current - theta);
  ctx.save();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = PALETTE.sig.phaseAlight; ctx.beginPath(); ctx.arc(cx, cy, r * 0.22, 0, -theta, true); ctx.stroke();
  if (mag > 1e-8) { ctx.strokeStyle = PALETTE.sig.returnPower; ctx.beginPath(); ctx.arc(cx, cy, r * 0.32, -theta, -(theta + delta), delta > 0); ctx.stroke(); }
  const dx = cx + Math.cos(theta) * r * 0.98, dy = cy - Math.sin(theta) * r * 0.98;
  ctx.setLineDash([4, 4]); ctx.strokeStyle = PALETTE.dim; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(dx, dy); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = font(12); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = PALETTE.sig.phaseAlight; ctx.fillText(`θe = ${fmt(theta * 180 / Math.PI, 1)}°`, 10, 10);
  ctx.fillStyle = PALETTE.sig.returnPower; ctx.fillText(`δ = ${fmt(delta * 180 / Math.PI, 1)}°`, 10, 26);
  ctx.fillStyle = PALETTE.muted; ctx.textBaseline = 'bottom'; ctx.fillText('d', dx + 4, dy - 2);
  ctx.restore();
}

function drawDegreeScale(ctx, cx, cy, r) {
  ctx.save(); ctx.font = font(10); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let deg = 0; deg < 360; deg += 15) {
    const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), major = deg % 30 === 0;
    ctx.strokeStyle = major ? PALETTE.dim : PALETTE.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx + (r + 3) * c, cy - (r + 3) * s); ctx.lineTo(cx + (r + (major ? 9 : 6)) * c, cy - (r + (major ? 9 : 6)) * s); ctx.stroke();
    if (major) { ctx.fillStyle = PALETTE.dim; ctx.fillText(`${deg}°`, cx + (r + 20) * c, cy - (r + 20) * s); }
  }
  ctx.textAlign = 'left'; ctx.fillStyle = PALETTE.dim;
  ctx.fillText('1.0 IN', cx + r / 1.5 + 3, cy + 10); ctx.fillText('1.5 IN', cx + r + 3, cy + 10);
  ctx.restore();
}

function drawPowerFactorGauge(ctx, W, H, S) {
  const s = S.signals, R = Math.min(46, W * 0.11), gx = 22 + R, gy = H - 30;
  ctx.save();
  ctx.fillStyle = 'rgba(8,8,8,.92)'; ctx.strokeStyle = PALETTE.line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(gx - R - 14, gy - R - 26, 2 * R + 28, R + 48); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = PALETTE.lineStrong; ctx.beginPath(); ctx.arc(gx, gy, R, Math.PI, 0); ctx.stroke();
  ctx.beginPath(); ctx.arc(gx, gy, R, 0, Math.PI); ctx.setLineDash([2, 3]); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(gx - R, gy); ctx.lineTo(gx + R, gy); ctx.stroke();
  ctx.font = font(9.5); ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = PALETTE.dim;
  for (const v of [-1, 0, 1]) { const x = gx + v * R; ctx.beginPath(); ctx.moveTo(x, gy - 3); ctx.lineTo(x, gy + 3); ctx.stroke(); ctx.fillText(String(v), x, gy + 5); }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = PALETTE.sig.cosPhi; ctx.font = font(11, 600);
  const label = s.cosPhi === null ? `cos φ: ${tr('pfUndefined')}` : `cos φ ${fmt(s.cosPhi, 3)} · ${tr(Math.abs(s.phi) < 0.01 ? 'pfUnity' : s.phi < 0 ? 'pfLag' : 'pfLead')}`;
  ctx.fillText(label, gx - R - 8, gy - R - 10);
  if (s.cosPhi !== null) {
    const ex = gx + R * Math.cos(s.phi), ey = gy - R * Math.sin(s.phi);
    ctx.setLineDash([3, 3]); ctx.strokeStyle = PALETTE.sig.cosPhi; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex, gy); ctx.stroke(); ctx.setLineDash([]);
    arrow(ctx, gx, gy, ex, ey, PALETTE.sig.cosPhi, 2);
    circle(ctx, ex, gy, 3, null, 0, PALETTE.sig.cosPhi);
  }
  ctx.restore();
}

function drawVectors(canvas, S, layers) {
  const ctx = canvas.getContext('2d'), W = canvas._w, H = canvas._h;
  if (!W || !H) return;
  vectorHits.length = 0;
  const sig = S.signals, base = configuration(S.poles).nominal.statorCurrent;
  ctx.fillStyle = PALETTE.inset; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, r = Math.min(W, H) * 0.34, scale = r / (base * 1.5);
  circle(ctx, cx, cy, r / 1.5, PALETTE.line, 1, null);
  circle(ctx, cx, cy, r, PALETTE.lineStrong, 1, null);
  drawDegreeScale(ctx, cx, cy, r);
  ctx.strokeStyle = PALETTE.line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke();
  ctx.fillStyle = PALETTE.muted; ctx.font = font(12, 600); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('α', cx + r + 4, cy - 4); ctx.fillText('β', cx + 5, cy - r - 4);
  if (layers.angles) drawAngleMarkers(ctx, cx, cy, r, S);
  if (layers.phases) {
    [{ v: sig.ia, a: 0, c: PALETTE.sig.phaseA, l: 'A' }, { v: sig.ib, a: TWO_PI / 3, c: PALETTE.sig.phaseB, l: 'B' }, { v: sig.ic, a: -TWO_PI / 3, c: PALETTE.sig.phaseC, l: 'C' }]
      .forEach(p => { const m = 2 * p.v / 3; drawVector(ctx, cx, cy, scale, m * Math.cos(p.a), m * Math.sin(p.a), p.c, p.l, null, 2); });
  }
  if (layers.clarke) {
    drawVector(ctx, cx, cy, scale, sig.alpha, 0, PALETTE.sig.alpha, 'Iα', 'clarkeAxis');
    drawVector(ctx, cx, cy, scale, 0, sig.beta, PALETTE.sig.beta, 'Iβ', 'clarkeAxis');
  }
  if (layers.park) {
    const a = S.poles * S.angle;
    drawVector(ctx, cx, cy, scale, S.id * Math.cos(a), S.id * Math.sin(a), PALETTE.sig.d, 'Id', 'parkAxis');
    drawVector(ctx, cx, cy, scale, -S.iq * Math.sin(a), S.iq * Math.cos(a), PALETTE.sig.q, 'Iq', 'parkAxis');
  }
  if (layers.result) drawVector(ctx, cx, cy, scale, sig.alpha, sig.beta, PALETTE.text, 'I', 'resultAxis', 3);
  if (layers.powerFactor) drawPowerFactorGauge(ctx, W, H, S);
}

/* ==========================================================================
 * graph.js — combined trend graph (each trace scaled to ±150 % of its nominal).
 * ========================================================================== */

function graphRange(S, windowSeconds) { const end = Math.max(S.time, windowSeconds); return { start: end - windowSeconds, end }; }
function graphBounds(W, H) { return { left: 48, top: 30, width: Math.max(1, W - 62), height: Math.max(1, H - 58) }; }
function signalScale(S, d) { return configuration(S.poles).nominal[d.scale]; }
/** Vertical position of a value; yr = {lo, hi} in fractions of nominal. */
function traceY(b, value, scale, yr) { return b.top + (yr.hi - value / scale) / (yr.hi - yr.lo) * b.height; }

/** "Nice" grid step for a span (1, 2, 2.5, 5 × 10^k). */
function niceStep(span, target) {
  const raw = span / target, mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
}

/**
 * Y range for the visible traces. Fixed mode: ±150 % of nominal.
 * Auto mode: min/max of the visible (normalised) samples with padding, rounded to the grid;
 * the range grows at once and shrinks only when the data use less than 85 % of it (no jitter).
 */
function graphYRange(S, H, view, range, chosen) {
  if (!view.yAuto || !chosen.length) return { lo: -1.5, hi: 1.5 };
  let lo = Infinity, hi = -Infinity;
  const first = Math.max(H.start, findHistoryIndex(H, range.start)), last = Math.min(H.samples.length, findHistoryIndex(H, range.end) + 1);
  const stride = Math.max(1, Math.floor((last - first) / 1500));
  for (const d of chosen) {
    const scale = signalScale(S, d);
    for (let i = first; i < last; i += stride) {
      const v = H.samples[i][d.key];
      if (v === null || !Number.isFinite(v)) continue;
      const n = v / scale; if (n < lo) lo = n; if (n > hi) hi = n;
    }
  }
  if (!Number.isFinite(lo)) return view.yr || { lo: -1.5, hi: 1.5 };
  const pad = Math.max((hi - lo) * 0.08, 0.05);
  lo -= pad; hi += pad;
  if (hi - lo < 0.2) { const m = (hi + lo) / 2; lo = m - 0.1; hi = m + 0.1; }
  const step = niceStep(hi - lo, 10);
  const target = { lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step };
  const cur = view.yr;
  if (cur && target.lo >= cur.lo && target.hi <= cur.hi && (target.hi - target.lo) > 0.85 * (cur.hi - cur.lo)) return cur;
  return target;
}

function drawGraphGrid(ctx, W, H, range, b, windowSeconds, yr) {
  ctx.fillStyle = PALETTE.inset; ctx.fillRect(0, 0, W, H);
  ctx.font = font(10.5); ctx.lineWidth = 1;
  const step = niceStep(yr.hi - yr.lo, 6), digits = step * 100 < 1 ? 1 : 0;
  for (let v = Math.ceil(yr.lo / step - 1e-9) * step; v <= yr.hi + 1e-9; v += step) {
    const y = traceY(b, v, 1, yr), rounded = Math.abs(v) < 1e-9 ? 0 : v;
    ctx.strokeStyle = rounded === 0 ? PALETTE.dim : PALETTE.line;
    ctx.beginPath(); ctx.moveTo(b.left, y); ctx.lineTo(b.left + b.width, y); ctx.stroke();
    ctx.fillStyle = PALETTE.dim; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(`${rounded > 0 ? '+' : ''}${fmt(rounded * 100, digits)}%`, b.left - 6, y);
  }
  for (const v of [-1, 1]) {
    if (v <= yr.lo || v >= yr.hi) continue;
    const y = traceY(b, v, 1, yr);
    ctx.strokeStyle = PALETTE.lineStrong; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(b.left, y); ctx.lineTo(b.left + b.width, y); ctx.stroke(); ctx.setLineDash([]);
  }
  for (let i = 0; i <= 5; i++) {
    const f = i / 5, x = b.left + f * b.width, time = range.start + f * (range.end - range.start);
    ctx.strokeStyle = PALETTE.line; ctx.beginPath(); ctx.moveTo(x, b.top); ctx.lineTo(x, b.top + b.height); ctx.stroke();
    ctx.fillStyle = PALETTE.dim; ctx.textAlign = i === 0 ? 'left' : i === 5 ? 'right' : 'center'; ctx.textBaseline = 'top';
    ctx.fillText(windowSeconds < 1 ? `${fmt(time * 1000, 0)} ${unit('ms')}` : `${fmt(time, windowSeconds < 5 ? 2 : 1)} ${unit('s')}`, x, b.top + b.height + 6);
  }
  ctx.strokeStyle = PALETTE.lineStrong; ctx.strokeRect(b.left + 0.5, b.top + 0.5, b.width - 1, b.height - 1);
}

function drawTrend(ctx, S, H, d, b, range, yr) {
  const samples = H.samples, first = Math.max(H.start, findHistoryIndex(H, range.start) - 1);
  const last = Math.min(samples.length, findHistoryIndex(H, range.end) + 1);
  const stride = Math.max(1, Math.floor((last - first) / (b.width * 2)));
  const duration = range.end - range.start, scale = signalScale(S, d);
  ctx.save(); ctx.beginPath(); ctx.rect(b.left, b.top, b.width, b.height); ctx.clip();
  ctx.strokeStyle = PALETTE.sig[d.color]; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
  if (d.dashed) ctx.setLineDash([6, 4]);
  ctx.beginPath();
  let started = false;
  const plot = sample => {
    const v = sample[d.key];
    if (v === null || !Number.isFinite(v)) { started = false; return; }
    const x = b.left + (sample.time - range.start) / duration * b.width, y = traceY(b, v, scale, yr);
    if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
  };
  for (let i = first; i < last; i += stride) plot(samples[i]);
  if (last > first) plot(samples[last - 1]);
  ctx.stroke(); ctx.restore();
}

function drawTripMarkers(ctx, S, b, range) {
  ctx.save(); ctx.beginPath(); ctx.rect(b.left, b.top - 8, b.width, b.height + 8); ctx.clip();
  for (const e of S.events) {
    if (e.time < range.start || e.time > range.end) continue;
    const x = b.left + (e.time - range.start) / (range.end - range.start) * b.width;
    const xs = b.left + (e.startTime - range.start) / (range.end - range.start) * b.width;
    ctx.fillStyle = 'rgba(242,177,60,.12)'; ctx.fillRect(Math.max(b.left, xs), b.top, x - Math.max(b.left, xs), b.height);
    ctx.strokeStyle = PALETTE.trip; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, b.top); ctx.lineTo(x, b.top + b.height); ctx.stroke();
    ctx.fillStyle = PALETTE.trip; ctx.beginPath(); ctx.moveTo(x - 5, b.top - 6); ctx.lineTo(x + 5, b.top - 6); ctx.lineTo(x, b.top + 2); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/** Legend of the selected signals across the top of the plot (also ends up in exported images). */
function drawLegend(ctx, defs, b) {
  ctx.font = font(11, 600); ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  let x = b.left, y = 12;
  for (const d of defs) {
    const w = ctx.measureText(d.label).width + 26;
    if (x + w > b.left + b.width) break;
    ctx.fillStyle = PALETTE.sig[d.color]; ctx.fillRect(x, y - 1.5, 14, 3);
    ctx.fillStyle = PALETTE.muted; ctx.fillText(d.label, x + 18, y);
    x += w;
  }
}

function drawGraph(canvas, S, H, view) {
  const ctx = canvas.getContext('2d'), W = canvas._w, Hh = canvas._h;
  if (!W || !Hh) return;
  const range = graphRange(S, view.window), b = graphBounds(W, Hh);
  const chosen = SIGNALS.filter(d => view.selected.has(d.key));
  const yr = view.yr = graphYRange(S, H, view, range, chosen);
  drawGraphGrid(ctx, W, Hh, range, b, view.window, yr);
  for (const d of chosen) drawTrend(ctx, S, H, d, b, range, yr);
  drawTripMarkers(ctx, S, b, range);
  drawLegend(ctx, chosen, b);
  if (view.cursorTime !== null) {
    const f = (view.cursorTime - range.start) / (range.end - range.start);
    if (f >= 0 && f <= 1) {
      const x = b.left + f * b.width;
      ctx.save(); ctx.strokeStyle = PALETTE.text; ctx.globalAlpha = .7; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(x, b.top); ctx.lineTo(x, b.top + b.height); ctx.stroke(); ctx.restore();
      const sample = nearestSample(H, view.cursorTime);
      if (sample) for (const d of chosen) {
        const v = sample[d.key]; if (v === null || !Number.isFinite(v)) continue;
        const y = traceY(b, v, signalScale(S, d), yr);
        if (y >= b.top && y <= b.top + b.height) circle(ctx, x, y, 3, PALETTE.inset, 1.5, PALETTE.sig[d.color]);
      }
    }
  }
}

/** Pointer handling: moves the cursor and returns the tooltip content, if any. */
function graphPointer(event, canvas, S, H, view) {
  const rect = canvas.getBoundingClientRect(), b = graphBounds(rect.width, rect.height), range = graphRange(S, view.window);
  const x = event.clientX - rect.left, y = event.clientY - rect.top, f = clamp((x - b.left) / b.width, 0, 1);
  view.cursorTime = range.start + f * (range.end - range.start);
  const reach = event.pointerType === 'touch' ? 16 : 8;
  let closestEvent = null, eventDistance = reach;
  for (const e of S.events) {
    if (e.time < range.start || e.time > range.end) continue;
    const d = Math.abs(x - (b.left + (e.time - range.start) / (range.end - range.start) * b.width));
    if (d < eventDistance) { eventDistance = d; closestEvent = e; }
  }
  if (closestEvent) return { kind: 'trip', text: `${tr('tripped')}: ${tr(closestEvent.reason)}\n${tr('eventTime')}: ${fmt(closestEvent.time, 3)} ${unit('s')}\n${tr('conditionStart')}: ${fmt(closestEvent.startTime, 3)} ${unit('s')}\n${tr('delay')}: ${fmt(closestEvent.delay, 3)} ${unit('s')}` };
  const sample = nearestSample(H, view.cursorTime);
  if (!sample) return null;
  let closest = null, distance = reach + 1;
  for (const d of SIGNALS) {
    if (!view.selected.has(d.key) || sample[d.key] === null || !Number.isFinite(sample[d.key])) continue;
    const delta = Math.abs(y - traceY(b, sample[d.key], signalScale(S, d), view.yr || { lo: -1.5, hi: 1.5 }));
    if (delta < distance) { distance = delta; closest = d; }
  }
  return closest ? { text: `${closest.label}\n${tr(closest.desc)}\n${fmt(sample[closest.key], 3)} ${unit(closest.unit)}` } : null;
}

/* ==========================================================================
 * cyclo.js — "Thyristors control" views: schematic, cabinet, conduction
 * timing and converter currents. Views are rebuilt only when their input
 * changes (conduction signature or history version).
 * ========================================================================== */

const CC_WINDOWS = [0.02, 0.05, 0.1, 0.2, 0.5, 1];
const ccView = { schematicKey: '', timingKey: '', timingAt: 0, chartKey: '', chart: null, timing: null, window: 0.05 };
function ccPhaseColors() { return [PALETTE.sig.phaseA, PALETTE.sig.phaseB, PALETTE.sig.phaseC]; }
/* Colours of the six supply-pair sectors (R→S, R→T, S→T, S→R, T→R, T→S). */
const CC_SECTOR_COLORS = ['#e04848', '#e08a2e', '#c9b63a', '#4fae6a', '#3f8fd0', '#8a63d2'];

/** Conduction signature of a snapshot; unchanged signature ⇒ no redraw. */
function ccSignature(snap) {
  return snap.states.map(o => o.map(b => `${b.p}${b.n}${b.group}${b.gate >= 0 ? 'g' : ''}`).join('.')).join('|') + snap.groups + LANG;
}

/* ---------- schematic (SVG) ---------- */

function ccSchematic(snap) {
  const W = 600, row = 185, H = 26 + 3 * row, cols = ccPhaseColors(), off = PALETTE.dim, wire = PALETTE.lineStrong, halo = PALETTE.inset;
  const ff = FONT.replace(/"/g, "'");
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${tr('ccSchematic')}" style="display:block;min-width:520px;width:100%;font-family:${ff}">`;
  s += `<text x="10" y="17" fill="${PALETTE.dim}" font-size="11">${tr('ccIllustrative')}</text>`;
  const n = ['R', 'S', 'T'];
  for (let o = 0; o < 3; o++) {
    const y = 26 + o * row;
    s += `<text x="8" y="${y + 14}" fill="${cols[o]}" font-size="14" font-weight="700">${'ABC'[o]}</text>`;
    for (let g = 0; g < snap.groups; g++) {
      const x = 40 + g * 270, b = snap.states[o][g];
      s += `<text x="${x}" y="${y + 13}" fill="${PALETTE.muted}" font-size="10">G${g + 1} (${g ? '−30°' : '0°'})</text>`;
      for (let p = 0; p < 3; p++) {
        const yy = y + 38 + p * 31, active = b.p === p || b.n === p;
        s += `<text x="${x}" y="${yy + 4}" fill="${PALETTE.muted}" font-size="10">${n[p]}</text><line x1="${x + 17}" y1="${yy}" x2="${x + 194}" y2="${yy}" stroke="${active ? cols[o] : wire}" stroke-width="${active ? 2.5 : 1}"/>`;
      }
      for (const sign of [1, -1]) {
        const bx = x + (sign > 0 ? 45 : 125);
        s += `<text x="${bx}" y="${y + 24}" fill="${PALETTE.muted}" font-size="10">${sign > 0 ? 'P (+)' : 'N (−)'}</text>`;
        s += `<line x1="${bx + 9}" y1="${y + 28}" x2="${bx + 9}" y2="${y + 142}" stroke="${wire}"/><line x1="${bx + 39}" y1="${y + 28}" x2="${bx + 39}" y2="${y + 142}" stroke="${wire}"/>`;
        for (let p = 0; p < 3; p++) for (let side = 0; side < 2; side++) {
          const xx = bx + 9 + side * 30, yy = y + 38 + p * 31, on = b.group === sign && (side === 0 ? b.p === p : b.n === p);
          const color = on ? cols[o] : off, label = ccThyristorId(sign, side, p);
          const pts = side === 0 ? `${xx - 6},${yy - 7} ${xx + 6},${yy - 7} ${xx},${yy + 3}` : `${xx - 6},${yy + 7} ${xx + 6},${yy + 7} ${xx},${yy - 3}`;
          const bar = side === 0 ? yy + 5 : yy - 5;
          // Labels sit above the valve, offset outward, with a dark halo so they stay readable over wires.
          const lx = side === 0 ? xx - 8 : xx + 8, anchor = side === 0 ? 'end' : 'start';
          s += `<g><title>G${g + 1} ${label} • ${n[p]} • ${tr(on ? 'ccConducting' : 'ccOff')}</title>`
            + `<polygon points="${pts}" fill="${on ? color : halo}" stroke="${color}" stroke-width="1.4"/>`
            + `<line x1="${xx - 7}" y1="${bar}" x2="${xx + 7}" y2="${bar}" stroke="${color}" stroke-width="1.5"/>`
            + `<text x="${lx}" y="${yy - 8}" text-anchor="${anchor}" font-size="${on ? 9.5 : 8.5}" font-weight="${on ? 700 : 400}" fill="${on ? '#fff' : off}" stroke="${halo}" stroke-width="3" paint-order="stroke">${label}</text></g>`;
        }
        s += `<line x1="${bx + 9}" y1="${y + 142}" x2="${bx + 39}" y2="${y + 142}" stroke="${b.group === sign ? cols[o] : wire}" stroke-width="${b.group === sign ? 2.5 : 1}"/>`;
      }
      s += `<path d="M ${x + 94} ${y + 142} L ${x + 220} ${y + 142} L ${x + 220} ${y + 130}" fill="none" stroke="${b.p >= 0 ? cols[o] : wire}" stroke-width="2"/><text x="${x + 195}" y="${y + 126}" fill="${cols[o]}" font-size="10">→ ${'ABC'[o]}</text>`;
      s += `<text x="${x}" y="${y + 165}" fill="${PALETTE.muted}" font-size="10">${b.p < 0 ? tr('ccNoPair') : `${n[b.p]} → ${n[b.n]}  ${b.group > 0 ? 'P' : 'N'}${b.gate >= 0 ? ' • gate' : ''}`}</text>`;
    }
  }
  return s + '</svg>';
}

function ccCabinet(snap) {
  let html = '<div class="cc-cab">';
  for (let o = 0; o < 3; o++) {
    html += `<div class="cc-cab-phase" style="border-top:3px solid ${ccPhaseColors()[o]}"><b>${tr('ccPhaseWord')} ${'ABC'[o]}</b>`;
    for (let g = 0; g < snap.groups; g++) {
      const b = snap.states[o][g];
      html += `<div class="cc-cab-group">G${g + 1} ${g ? '−30°' : '0°'}</div>`;
      for (const sign of [1, -1]) {
        html += `<div class="cc-cab-group">${sign > 0 ? 'P (+)' : 'N (−)'}</div><div class="cc-cab-grid">`;
        for (let p = 0; p < 3; p++) for (let side = 0; side < 2; side++) {
          const on = b.group === sign && (side === 0 ? b.p === p : b.n === p);
          html += `<span class="cc-valve${on ? ' on' : ''}" title="${'RST'[p]} • ${tr(on ? 'ccConducting' : 'ccOff')}">${ccThyristorId(sign, side, p)}</span>`;
        }
        html += '</div>';
      }
    }
    html += '</div>';
  }
  return html + '</div>';
}

/* ---------- shared time axis for the two canvases ---------- */

const CC_LEFT = 64, CC_RIGHT = 12;
function ccTimeAxis(c, W, top, bottom, start, span) {
  c.font = font(10.5); c.textBaseline = 'top';
  for (let i = 0; i <= 4; i++) {
    const x = CC_LEFT + i * (W - CC_LEFT - CC_RIGHT) / 4, t = start + i * span / 4;
    c.strokeStyle = PALETTE.line; c.lineWidth = 1; c.beginPath(); c.moveTo(x, top); c.lineTo(x, bottom); c.stroke();
    c.fillStyle = PALETTE.dim; c.textAlign = i === 0 ? 'left' : i === 4 ? 'right' : 'center';
    c.fillText(span < 1 ? `${fmt(t * 1000, 0)} ${unit('ms')}` : `${fmt(t, 2)} ${unit('s')}`, x, bottom + 5);
  }
}

/* ---------- conduction timing (canvas) ----------
 * One lane per output phase and bridge group. Upper bar = P bridge (positive
 * current), lower bar = N bridge. Segment colour = supply pair (sector);
 * the label names the two conducting thyristors when there is room. */

function ccTimingLanes(groups) {
  const lanes = [];
  for (let o = 0; o < 3; o++) for (let g = 0; g < groups; g++) lanes.push({ o, g });
  return lanes;
}

function ccTiming(S, canvas) {
  const W = canvas._w, H = canvas._h, c = canvas.getContext('2d');
  if (!W || !H) return;
  const groups = configuration(S.poles).pulses === 12 ? 2 : 1, lanes = ccTimingLanes(groups), span = ccView.window;
  const end = S.time, start = end - span, top = 6, bottom = H - 20, laneH = (bottom - top) / lanes.length;
  const xOf = t => CC_LEFT + (t - start) / span * (W - CC_LEFT - CC_RIGHT);
  c.fillStyle = PALETTE.inset; c.fillRect(0, 0, W, H);
  ccTimeAxis(c, W, top, bottom, start, span);
  const h = CC.history;
  let lo = 0, hi = h.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (h[m].t < start) lo = m + 1; else hi = m; }
  // collect segments per lane and bridge in one pass
  const segs = lanes.map(() => ({ P: [], N: [] })), open = lanes.map(() => null);
  for (let i = lo; i < h.length && h[i].t <= end; i++) {
    const z = h[i];
    lanes.forEach((lane, k) => {
      const b = z.states[lane.o] && z.states[lane.o][lane.g];
      const key = b && b.p >= 0 ? `${b.group}|${b.sector}` : null, cur = open[k];
      if (cur && cur.key === key) { cur.t1 = z.t; return; }
      if (cur) segs[k][cur.bridge].push(cur);
      open[k] = key ? { key, bridge: b.group > 0 ? 'P' : 'N', sector: b.sector, p: b.p, n: b.n, sign: b.group, t0: z.t, t1: z.t } : null;
    });
  }
  open.forEach((cur, k) => { if (cur) segs[k][cur.bridge].push(cur); });

  c.font = font(10, 700); c.textBaseline = 'middle';
  const cols = ccPhaseColors();
  lanes.forEach((lane, k) => {
    const y0 = top + k * laneH, barH = Math.max(6, Math.min(13, laneH * 0.36)), yP = y0 + laneH * 0.5 - barH - 1, yN = y0 + laneH * 0.5 + 1;
    if (k) { c.strokeStyle = PALETTE.line; c.beginPath(); c.moveTo(0, y0); c.lineTo(W, y0); c.stroke(); }
    c.fillStyle = cols[lane.o]; c.textAlign = 'left'; c.font = font(11, 700);
    c.fillText(`${'ABC'[lane.o]}${groups > 1 ? ` · G${lane.g + 1}` : ''}`, 6, y0 + laneH / 2 - 6);
    c.fillStyle = PALETTE.dim; c.font = font(9.5);
    c.fillText('P', CC_LEFT - 12, yP + barH / 2); c.fillText('N', CC_LEFT - 12, yN + barH / 2);
    c.fillStyle = PALETTE.surface; c.fillRect(CC_LEFT, yP, W - CC_LEFT - CC_RIGHT, barH); c.fillRect(CC_LEFT, yN, W - CC_LEFT - CC_RIGHT, barH);
    for (const bridge of ['P', 'N']) for (const sgm of segs[k][bridge]) {
      const x0 = Math.max(CC_LEFT, xOf(sgm.t0)), x1 = Math.min(W - CC_RIGHT, xOf(sgm.t1 + CC.dt));
      if (x1 <= x0) continue;
      const y = bridge === 'P' ? yP : yN;
      c.fillStyle = CC_SECTOR_COLORS[sgm.sector]; c.fillRect(x0, y, x1 - x0 - 0.5, barH);
      const label = `${ccThyristorId(sgm.sign, 0, sgm.p)}·${ccThyristorId(sgm.sign, 1, sgm.n)}`;
      c.font = font(Math.min(10, barH - 1), 700);
      if (x1 - x0 > c.measureText(label).width + 6) { c.fillStyle = '#000'; c.textAlign = 'center'; c.fillText(label, (x0 + x1) / 2, y + barH / 2 + 0.5); }
    }
  });
  if (!h.length) { c.fillStyle = PALETTE.muted; c.textAlign = 'center'; c.font = font(12); c.fillText(tr('ccNoHistory'), W / 2, H / 2); }
  ccView.timing = { lanes, segs, start, span, top, laneH, W };
}

function ccTimingHover(event, canvas) {
  const q = ccView.timing; if (!q) return '';
  const r = canvas.getBoundingClientRect(), x = event.clientX - r.left, y = event.clientY - r.top;
  if (x < CC_LEFT) return '';
  const k = Math.floor((y - q.top) / q.laneH); if (k < 0 || k >= q.lanes.length) return '';
  const t = q.start + (x - CC_LEFT) / (q.W - CC_LEFT - CC_RIGHT) * q.span, lane = q.lanes[k];
  const all = q.segs[k].P.concat(q.segs[k].N), s = all.find(z => t >= z.t0 && t <= z.t1 + CC.dt);
  const head = `${tr('ccPhaseWord')} ${'ABC'[lane.o]}, G${lane.g + 1} · t = ${fmt(t * 1000, 1)} ${unit('ms')}`;
  if (!s) return `${head} · ${tr('ccNoPair')}`;
  return `${head} · ${s.sign > 0 ? 'P' : 'N'}: ${ccThyristorId(s.sign, 0, s.p)} + ${ccThyristorId(s.sign, 1, s.n)} (${'RST'[s.p]} → ${'RST'[s.n]})`;
}

/* ---------- converter currents (canvas) ---------- */

function ccChartDefs(groups) {
  const defs = [], cols = ccPhaseColors();
  for (let o = 0; o < 3; o++) {
    const phase = 'ABC'[o];
    defs.push({ key: `I*${phase}`, color: cols[o], width: 2.2, on: true, desc: `${tr('ccSetpoint')} ${phase}`, get: z => z.target[o] });
    for (let g = 0; g < groups; g++) for (let p = 0; p < 3; p++) {
      const network = 'RST'[p], hue = (o * 115 + g * 48 + p * 23 + 20) % 360;
      defs.push({ key: `${phase}·G${g + 1}${network}`, color: `hsl(${hue},70%,66%)`, width: 1.1, on: o === 0,
        desc: `${tr('ccInputCurrent')} ${network}, ${tr('ccGroup')} ${g + 1}, ${tr('ccPhaseWord').toLowerCase()} ${phase}`, get: z => z.currents[o * z.groups + g][p] });
    }
  }
  return defs;
}

function ccChart(S, canvas, checks, onToggle) {
  const groups = configuration(S.poles).pulses === 12 ? 2 : 1, defs = ccChartDefs(groups), span = ccView.window;
  const signature = defs.map(d => d.key).join(',') + '|' + LANG;
  if (checks.dataset.signature !== signature) {
    checks.dataset.signature = signature; checks.textContent = '';
    for (const d of defs) {
      const label = document.createElement('label'); label.title = d.desc; label.style.color = d.color;
      const input = document.createElement('input'); input.type = 'checkbox'; input.dataset.key = d.key;
      input.checked = d.key in CC.checkState ? CC.checkState[d.key] : d.on;
      input.addEventListener('change', () => { CC.checkState[d.key] = input.checked; onToggle(); });
      label.append(input, document.createTextNode(' ' + d.key)); checks.appendChild(label);
    }
  }
  const W = canvas._w, H = canvas._h, c = canvas.getContext('2d');
  if (!W || !H) return;
  c.fillStyle = PALETTE.inset; c.fillRect(0, 0, W, H);
  const enabled = new Set(Array.from(checks.querySelectorAll('input:checked'), x => x.dataset.key));
  const end = S.time, start = end - span;
  const history = CC.history.filter(z => z.t >= start && z.t <= end && z.groups === groups);
  let peak = 0;
  for (const z of history) for (const d of defs) if (enabled.has(d.key)) peak = Math.max(peak, Math.abs(d.get(z)));
  const raw = peak * 1.12, exponent = raw > 0 ? Math.pow(10, Math.floor(Math.log10(raw))) : 1, scaled = raw / exponent;
  const scale = raw > 0 ? (scaled <= 1 ? 1 : scaled <= 2 ? 2 : scaled <= 5 ? 5 : 10) * exponent : 1;
  const L = CC_LEFT, R = W - CC_RIGHT, T = 8, B = H - 22;
  ccTimeAxis(c, W, T, B, start, span);
  c.font = font(10.5); c.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {
    const y = (T + B) / 2 - i * (B - T) / 4;
    c.strokeStyle = i === 0 ? PALETTE.dim : PALETTE.line; c.beginPath(); c.moveTo(L, y); c.lineTo(R, y); c.stroke();
    c.fillStyle = PALETTE.dim; c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillText(fmt(i * scale / 2, 2), L - 6, y);
  }
  c.save(); c.beginPath(); c.rect(L, T, R - L, B - T); c.clip();
  const stride = Math.max(1, Math.floor(history.length / ((R - L) * 2)));
  for (const d of defs) {
    if (!enabled.has(d.key)) continue;
    c.strokeStyle = d.color; c.lineWidth = d.width; c.beginPath();
    for (let i = 0; i < history.length; i += stride) {
      const z = history[i], x = L + (z.t - start) / span * (R - L), y = (T + B) / 2 - d.get(z) / scale * (B - T) / 2;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
  }
  c.restore();
  ccView.chart = { defs, history, start, span, L, R, T, B, scale, enabled };
}

function ccHoverText(event, canvas) {
  const q = ccView.chart;
  if (!q || !q.history.length) return '';
  const box = canvas.getBoundingClientRect(), x = event.clientX - box.left, y = event.clientY - box.top;
  const t = q.start + (x - q.L) / (q.R - q.L) * q.span;
  let lo = 0, hi = q.history.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (q.history[m].t < t) lo = m + 1; else hi = m; }
  const z = q.history[lo];
  let best = null, dist = Infinity;
  for (const d of q.defs) {
    if (!q.enabled.has(d.key)) continue;
    const dy = Math.abs((q.T + q.B) / 2 - d.get(z) / q.scale * (q.B - q.T) / 2 - y);
    if (dy < dist) { dist = dy; best = d; }
  }
  return best && dist < 18 ? `${best.key}: ${best.desc} = ${fmt(best.get(z), 3)} ${unit('pu')}; t = ${fmt(z.t * 1000, 1)} ${unit('ms')}` : '';
}

/** Renders the open module. `force` bypasses the change checks (language, resize). */
function renderCyclo(S, E, force, onToggle) {
  const snap = ccSnapshot(S, S.time), pulses = configuration(S.poles).pulses;
  E.ccStatus.textContent = `${pulses}${tr('ccPulse')} • ${tr('ccInput')} 50 ${unit('Hz')} • ${tr('ccOutput')} ${fmt(ccOutputHz(S), 2)} ${unit('Hz')} (${tr('ccSigned')}) • α = ${CC.alpha}° • ${tr('ccOpens')}`;
  const key = ccSignature(snap);
  if (force || key !== ccView.schematicKey) {
    ccView.schematicKey = key;
    E.ccSchematic.innerHTML = ccSchematic(snap);
    E.ccCabinet.innerHTML = ccCabinet(snap);
  }
  const now = performance.now(), tKey = `${CC.version}|${ccView.window}|${LANG}|${S.poles}`;
  if (force || (tKey !== ccView.timingKey && now - ccView.timingAt > 100)) {
    ccView.timingKey = tKey; ccView.timingAt = now;
    ccTiming(S, E.ccTiming);
  }
  const cKey = `${CC.version}|${ccView.window}|${LANG}|${S.poles}|${JSON.stringify(CC.checkState)}`;
  if (force || cKey !== ccView.chartKey) { ccView.chartKey = cKey; ccChart(S, E.ccChart, E.ccChecks, onToggle); }
}

/* ==========================================================================
 * app.js — application controller: welcome screen, generated controls,
 * rendering loop, persistence, export and keyboard shortcuts.
 * The model lives in S (state) and H (history). Controls, signal pickers,
 * annunciator, read-outs and the limits table are generated from the
 * subsystem registry (core/registry.js).
 * ========================================================================== */

const STORAGE_KEY = 'gmd-simulator-v3';
const LAYER_IDS = { material: 'showMaterial', currents: 'showCurrents', fields: 'showFields', phases: 'showPhases', result: 'showResult', powerFactor: 'showPowerFactor', clarke: 'showClarke', park: 'showPark', angles: 'showAngles' };
const DEFAULT_LAYERS = { material: true, currents: true, fields: true, phases: true, result: true, powerFactor: true, clarke: false, park: false, angles: true };

const App = {
  S: null, H: null, E: {},
  view: { window: WINDOWS[10], cursorTime: null, yAuto: true, yr: null, selected: new Set(SIGNALS.filter(d => d.checked).map(d => d.key)) },
  layers: Object.assign({}, DEFAULT_LAYERS),
  controls: {}, readouts: {}, annunciator: {},
  dirty: true, savedAnimation: null, lastFrame: null, accumulator: 0, slowUntil: 0, freshTripUntil: 0, lastTripReason: null, onWelcome: true,
};

/* ---------- persistence ---------- */

function loadStored() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { return null; } }
let saveTimer = null;
function saveSettings() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      const settings = {};
      for (const k of SETTING_KEYS) settings[k] = App.S[k];
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ lang: LANG, settings, layers: App.layers, selected: [...App.view.selected], window: App.view.window, yAuto: App.view.yAuto, ccWindow: ccView.window }));
    } catch (e) { /* storage unavailable: settings simply are not kept */ }
  }, 300);
}

/* ---------- element collection ---------- */

function collectElements() {
  document.querySelectorAll('[id]').forEach(node => { App.E[node.id] = node; });
  tooltipEl = App.E.tooltip;
}

/* ---------- generated parameter controls ---------- */

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
function paramLabel(p) { return p.text || tr(p.label); }
function toSlider(p, v) { return p.log ? Math.log10(v) : v; }
function fromSlider(p, v) { return p.log ? Math.pow(10, Number(v)) : Number(v); }
function formatParam(p, v) {
  if (p.format) return p.format(v);
  return `${fmt(v, p.digits === undefined ? 2 : p.digits)}${p.unit ? ' ' + unit(p.unit) : ''}`;
}

/** Builds every parameter control from the registry into its panel container. */
function buildParamControls() {
  for (const box of document.querySelectorAll('.params[data-panel]')) {
    box.textContent = '';
    for (const p of PARAMS.filter(q => q.panel === box.dataset.panel)) box.appendChild(buildControl(p));
  }
}

function buildControl(p) {
  const wrap = el('div', 'field'), c = { p, wrap };
  const id = `param-${p.key}`;
  if (p.type === 'range') {
    const head = el('div', 'field-head'), label = el('label'), out = el('output');
    label.htmlFor = id; head.append(label, out);
    const row = el('div', 'field-row'), input = el('input');
    input.type = 'range'; input.id = id;
    input.min = toSlider(p, p.min); input.max = toSlider(p, paramMax(p, App.S)); input.step = p.log ? 0.01 : p.step;
    row.appendChild(input);
    input.addEventListener('input', () => setParam(p, fromSlider(p, input.value)));
    if (p.number) {
      const num = el('input'); num.type = 'number'; num.step = p.log ? 'any' : p.step; num.setAttribute('aria-label', paramLabel(p));
      num.addEventListener('change', () => {
        const v = Number(num.value);
        if (num.value.trim() === '' || !Number.isFinite(v)) { refreshControl(c, true); return; }
        setParam(p, clamp(v, p.min, paramMax(p, App.S)));
      });
      row.appendChild(num); c.number = num;
    }
    wrap.append(head, row);
    Object.assign(c, { label, out, input });
  } else if (p.type === 'check') {
    const label = el('label', 'check'), input = el('input'), text = el('span');
    input.type = 'checkbox'; input.addEventListener('change', () => setParam(p, input.checked));
    label.append(input, text); wrap.appendChild(label);
    Object.assign(c, { input, labelText: text });
  } else if (p.type === 'choice' || p.type === 'segmented') {
    const group = el('div', p.type === 'choice' ? 'choices' : 'segmented'); group.setAttribute('role', 'radiogroup');
    c.radios = []; c.optionLabels = [];
    for (const [value, key] of p.options) {
      const label = el('label'), input = el('input'), text = el('span');
      input.type = 'radio'; input.name = id; input.value = value;
      input.addEventListener('change', () => { if (input.checked) setParam(p, value); });
      label.append(input, text); group.appendChild(label);
      c.radios.push(input); c.optionLabels.push([text, key]);
    }
    if (p.type === 'segmented') {
      const head = el('div', 'field-head'), label = el('span'); head.appendChild(label);
      const row = el('div', 'field-row'); row.appendChild(group);
      wrap.append(head, row); c.label = label;
    } else wrap.appendChild(group);
  }
  if (p.hint) { c.hint = el('p', 'hint'); wrap.appendChild(c.hint); }
  App.controls[p.key] = c;
  return wrap;
}

/** Applies a user change: side effects first (bumpless transfer), then the value. */
function setParam(p, value) {
  const S = App.S;
  if (p.onChange && S[p.key] !== value) p.onChange(S, value);
  S[p.key] = value;
  if (p.resetsModel) {
    resetModel();
    for (const q of PARAMS) if (typeof q.max === 'function') S[q.key] = Math.min(S[q.key], q.max(S));
  }
  S.signals = computeSignals(S);
  refreshControl(App.controls[p.key], true);
  saveSettings(); invalidate();
}

function translateControls() {
  for (const c of Object.values(App.controls)) {
    const p = c.p;
    if (c.label) c.label.textContent = paramLabel(p);
    if (c.labelText) c.labelText.textContent = paramLabel(p);
    if (c.optionLabels) for (const [node, key] of c.optionLabels) node.textContent = tr(key);
    if (c.hint) c.hint.textContent = tr(p.hint);
  }
}

/** Writes state → control (value, label, enabled state, dynamic maximum). */
function refreshControl(c, force) {
  const S = App.S, p = c.p;
  const enabled = p.enabled ? p.enabled(S) : true;
  const value = !enabled && p.shown ? p.shown(S) : S[p.key];
  c.wrap.classList.toggle('disabled', !enabled);
  if (c.radios) {
    for (const r of c.radios) { r.checked = r.value === value; r.disabled = !enabled; }
    return;
  }
  if (p.type === 'check') { c.input.checked = !!value; c.input.disabled = !enabled; return; }
  if (typeof p.max === 'function') {
    const max = String(toSlider(p, paramMax(p, S)));
    if (c.input.max !== max) c.input.max = max;
    if (c.number) c.number.max = paramMax(p, S);
  }
  c.input.disabled = !enabled; if (c.number) c.number.disabled = !enabled;
  if (force || document.activeElement !== c.input) {
    const v = String(toSlider(p, value));
    if (c.input.value !== v) c.input.value = v;
  }
  if (c.number && (force || document.activeElement !== c.number)) c.number.value = p.log ? Number(value.toPrecision(4)) : Number(value.toFixed(p.digits === undefined ? 2 : p.digits));
  const text = formatParam(p, value);
  if (c.out.textContent !== text) c.out.textContent = text;
}

/* ---------- export ---------- */

function download(blob, name) {

  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCsv() {
  const S = App.S, H = App.H, range = graphRange(S, App.view.window);
  const defs = SIGNALS.filter(d => App.view.selected.has(d.key));
  const lines = [['time_s', ...defs.map(d => `${d.key}${d.unit ? '_' + d.unit.replace('/', 'per') : ''}`)].join(',')];
  for (let i = Math.max(H.start, findHistoryIndex(H, range.start)); i < H.samples.length; i++) {
    const s = H.samples[i]; if (s.time > range.end) break;

  }
  for (const e of S.events) lines.push(`# trip,${e.time.toFixed(3)},${e.reason},condition_start=${e.startTime.toFixed(3)}`);

/* ---------- interface refresh ---------- */

function statusState() {
  const S = App.S;
  if (S.tripped) return ['tripped', tr('tripped')];
  if (pendingTrip(S)) return ['pending', tr('pending')];
  if (S.paused && (S.run || S.time > 0)) return ['paused', tr('paused')];
  if (S.run) return ['running', tr('running')];
  if (Math.abs(S.speed) > 0.05 || S.ir > 0.05) return ['stopping', tr('stopping')];
  return ['stopped', tr('stopped')];
}

function setKv(r, text, units, state) {
  r.b.textContent = text;
  if (units) r.b.appendChild(el('small', '', unit(units)));
  if (state) r.row.dataset.state = state; else delete r.row.dataset.state;
}

function formatWindow(seconds) {
  if (seconds < 1) return `${Math.round(seconds * 1000)} ${unit('ms')}`;
  if (seconds >= 60) return `${fmt(seconds / 60, seconds % 60 ? 1 : 0)} ${unit('min')}`;
  return `${fmt(seconds, seconds % 1 ? 1 : 0)} ${unit('s')}`;
}

function updateInterface() {
  const S = App.S, E = App.E, sig = S.signals, now = performance.now();

  for (const c of Object.values(App.controls)) refreshControl(c, false);
  for (const node of document.querySelectorAll('[data-monitor]')) { const panel = PANELS[node.dataset.monitor]; if (panel && panel.monitor) node.textContent = panel.monitor(S); }

  E.windowLabel.textContent = formatWindow(App.view.window);
  E.ccWindowLabel.textContent = formatWindow(ccView.window);
  E.pauseText.textContent = tr(S.paused && (S.run || S.time > 0) ? 'resume' : 'pause');
  E.slowBanner.classList.toggle('visible', now < App.slowUntil);

  const degrees = wrap(S.angle, TWO_PI) * 180 / Math.PI;
  E.angleLabel.textContent = `${fmt(degrees, 1)}°`;
  E.electricalAngle.textContent = `${fmt(wrap(S.poles * S.angle, TWO_PI) * 180 / Math.PI, 1)}°`;
  E.angle.disabled = E.angleNumber.disabled = !S.paused;
  if (document.activeElement !== E.angle) E.angle.value = degrees;
  if (document.activeElement !== E.angleNumber) E.angleNumber.value = degrees.toFixed(1);

  // trip state
  const pending = pendingTrip(S);
  if (S.tripped && S.tripReason !== App.lastTripReason) App.freshTripUntil = now + 3000;
  App.lastTripReason = S.tripReason;
  let tripState = '', tripText = tr('healthy');
  if (S.tripped) { tripState = 'tripped'; tripText = `${tr('tripped')}: ${tr(S.tripReason)}`; }
  else if (pending) { tripState = 'pending'; tripText = `${tr('pending')}: ${tr(pending.key)} — ${fmt(Math.max(0, TRIP_DELAY - pending.elapsed), 2)} ${unit('s')}`; }
  E.tripStatus.textContent = tripText;
  if (tripState) E.tripStatus.dataset.state = tripState; else delete E.tripStatus.dataset.state;
  E.start.disabled = S.tripped; E.step.disabled = !S.paused; E.tripReset.disabled = !S.tripped;

  const [pillState, pillText] = statusState();
  E.statusPill.dataset.state = pillState; E.statusPill.textContent = `${pillText} · ${fmt(S.time, 1)} ${unit('s')}`;

  // annunciator: label only; countdown or "tripped" appears only when relevant
  const active = S.run || S.tripped ? activeConditions(S) : {};
  for (const p of PROTECTIONS) {
    const a = App.annunciator[p.key], timer = S.timers[p.key];
    let state = '';
    if (S.tripped && S.tripReason === p.key) state = 'tripped';
    else if (timer) state = 'pending';
    else if (active[p.key]) state = 'active';
    if (a.tile.dataset.state !== state) { if (state) a.tile.dataset.state = state; else delete a.tile.dataset.state; }
    a.tile.classList.toggle('fresh', state === 'tripped' && now < App.freshTripUntil);
    a.fill.style.width = timer ? `${clamp(timer.elapsed / TRIP_DELAY, 0, 1) * 100}%` : '0';
    a.detail.textContent = timer ? fmt(Math.max(0, TRIP_DELAY - timer.elapsed), 1) : '';
  }

  // read-outs from the registry
  const e = computeElectrical(S);
  setKv(App.readouts.status, pillText, '', pillState === 'tripped' ? 'tripped' : pillState === 'pending' ? 'pending' : '');
  App.readouts.status.row.dataset.state = pillState;
  setKv(App.readouts.time, fmt(S.time, 3), 's');
  for (const r of READOUTS) {
    const v = r.value(S, e);
    const state = r.protection && S.tripped && S.tripReason === r.protection ? 'tripped' : r.protection && S.timers[r.protection] ? 'pending' : '';
    setKv(App.readouts[r.key], typeof v === 'number' ? fmt(v, r.digits) : v, r.unit, state);
  }
  const values = [sig.ia, sig.ib, sig.ic, sig.alpha, sig.beta, sig.zero, sig.id, sig.iq, sig.imag, sig.cosPhi];
  App.vectorCells.forEach((b, i) => { b.textContent = values[i] === null ? '—' : fmt(values[i], 3); });
}

function updateCursorLine() {
  const E = App.E, view = App.view;
  if (view.cursorTime === null) { E.cursor.textContent = tr('cursorPrompt'); return; }
  const sample = nearestSample(App.H, view.cursorTime);
  if (!sample) { E.cursor.textContent = tr('cursorPrompt'); return; }
  const parts = SIGNALS.filter(d => view.selected.has(d.key)).map(d => `${d.label} ${sample[d.key] === null ? tr('pfUndefined') : fmt(sample[d.key], 3)}${d.unit ? ' ' + unit(d.unit) : ''}`);
  E.cursor.textContent = '';
  E.cursor.append(el('b', '', `${tr('recordedTime')} ${fmt(sample.time, 3)} ${unit('s')}`), document.createTextNode('  ' + (parts.length ? parts.join(' · ') : tr('noSignals'))));
}

/* ---------- rendering ---------- */

let forceCyclo = false;
function invalidate(force) { App.dirty = true; if (force) forceCyclo = true; }
function renderGraphOnly() { drawGraph(App.E.graph, App.S, App.H, App.view); updateCursorLine(); }

function renderAll() {
  const S = App.S, E = App.E;
  if (!S.signals || App.onWelcome) return;
  drawMachine(E.machine, S, App.layers);
  drawVectors(E.vectors, S, App.layers);
  renderGraphOnly();
  updateInterface();
  if (E.ccPanel.open) { renderCyclo(S, E, forceCyclo, () => invalidate()); forceCyclo = false; }
}

function resizeAll() {
  for (const c of [App.E.machine, App.E.vectors, App.E.graph, App.E.ccChart, App.E.ccTiming]) resizeCanvas(c);
  invalidate(true);
}

/* ---------- main loop ---------- */

const FRAME_BUDGET_MS = 22;
const CC_ANIMATION = 0.01;

/* ---------- toast ---------- */
let toastTimer = null;
function showToast(text, ms = 2500) {
  const t = App.E.toast; t.textContent = text; t.classList.add('visible');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('visible'), ms);
}
function frame(timestamp) {
  const S = App.S;
  if (App.lastFrame === null) App.lastFrame = timestamp;
  const realDelta = Math.min((timestamp - App.lastFrame) / 1000, 0.1);
  App.lastFrame = timestamp;
  if (!S.paused && !App.onWelcome) {
    App.accumulator += realDelta * S.animation;
    const t0 = performance.now();
    let steps = 0;
    while (App.accumulator >= DT) {
      advance(S, App.H); App.accumulator -= DT; steps++;
      if ((steps & 63) === 0 && performance.now() - t0 > FRAME_BUDGET_MS) { App.accumulator = 0; App.slowUntil = performance.now() + 1500; break; }
    }
    if (steps) App.dirty = true;
  }
  if (App.dirty) { App.dirty = false; renderAll(); }
  requestAnimationFrame(frame);
}

/* ---------- events ---------- */

function registerEvents() {
  const E = App.E, S = App.S;
  E.language.addEventListener('change', e => setLanguage(e.target.value));
  E.welcomeLanguage.addEventListener('change', e => setLanguage(e.target.value));
  E.enter.addEventListener('click', showApp);
  E.help.addEventListener('click', showWelcome);
  E.start.addEventListener('click', startModel);
  E.stop.addEventListener('click', stopModel);
  E.pause.addEventListener('click', togglePause);
  E.step.addEventListener('click', stepModel);
  E.tripReset.addEventListener('click', tripResetCommand);
  E.reset.addEventListener('click', resetModel);

  document.querySelectorAll('input[name=angleMode]').forEach(i => i.addEventListener('change', e => { S.angleMode = e.target.value; saveSettings(); }));
  E.angle.addEventListener('input', e => { setRotorAngle(S, App.H, Number(e.target.value)); ccReset(); invalidate(); });
  E.angleNumber.addEventListener('change', e => { setRotorAngle(S, App.H, Number(e.target.value)); ccReset(); invalidate(); });

  E.window.addEventListener('input', e => { App.view.window = WINDOWS[Number(e.target.value)]; App.view.cursorTime = null; App.view.yr = null; saveSettings(); invalidate(); });
  E.yAuto.addEventListener('change', () => { App.view.yAuto = E.yAuto.checked; App.view.yr = null; saveSettings(); invalidate(); });
  E.signalGroups.addEventListener('change', e => {
    const key = e.target.dataset.signal; if (!key) return;
    if (e.target.checked) App.view.selected.add(key); else App.view.selected.delete(key);
    App.view.yr = null; saveSettings(); invalidate();
  });
  for (const [layer, id] of Object.entries(LAYER_IDS)) E[id].addEventListener('change', () => { App.layers[layer] = E[id].checked; saveSettings(); invalidate(); });
  E.exportCsv.addEventListener('click', exportCsv);
  E.exportPng.addEventListener('click', exportPng);

  const graphMove = e => {
    const tip = graphPointer(e, E.graph, S, App.H, App.view);
    renderGraphOnly();
    if (tip) showTooltip(tip.text, e.clientX, e.clientY, tip.kind); else hideTooltip();
  };
  E.graph.addEventListener('pointermove', graphMove);
  E.graph.addEventListener('pointerdown', graphMove);
  E.graph.addEventListener('pointerleave', () => { App.view.cursorTime = null; hideTooltip(); renderGraphOnly(); });
  for (const [canvas, hits] of [[E.machine, machineHits], [E.vectors, vectorHits]]) {
    canvas.addEventListener('pointermove', e => segmentTooltip(e, canvas, hits));
    canvas.addEventListener('pointerdown', e => segmentTooltip(e, canvas, hits));
    canvas.addEventListener('pointerleave', hideTooltip);
  }

  // thyristors control
  E.ccPanel.addEventListener('toggle', () => {
    CC.recording = E.ccPanel.open;
    if (E.ccPanel.open) {
      // Slow the model down instead of pausing, so the valve switching is visible live.
      App.savedAnimation = S.animation; S.animation = CC_ANIMATION;
      App.accumulator = 0; App.lastFrame = null; ccReset();
      resizeCanvas(E.ccChart); resizeCanvas(E.ccTiming); showToast(tr('toastSlow')); invalidate(true);
    } else if (App.savedAnimation !== null) {
      // Restore the previous speed unless the user changed it while the module was open.
      if (S.animation === CC_ANIMATION) S.animation = App.savedAnimation;
      App.savedAnimation = null; invalidate();
    }
  });
  E.ccWindow.addEventListener('input', () => { ccView.window = CC_WINDOWS[Number(E.ccWindow.value)]; saveSettings(); invalidate(true); });
  E.ccClear.addEventListener('click', () => { ccReset(); invalidate(true); });
  E.ccChart.addEventListener('pointermove', e => { E.ccHover.textContent = ccHoverText(e, E.ccChart); });
  E.ccTiming.addEventListener('pointermove', e => { E.ccHover.textContent = ccTimingHover(e, E.ccTiming); });
  [E.ccChart, E.ccTiming].forEach(c => c.addEventListener('pointerleave', () => { E.ccHover.textContent = ''; }));

  // keyboard shortcuts (ignored while typing in a field)
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (App.onWelcome) { if (e.key === 'Enter' && e.target.tagName !== 'SELECT') { e.preventDefault(); showApp(); } return; }
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || (tag === 'BUTTON' && e.key === ' ') || tag === 'SUMMARY') return;
    const k = e.key.toLowerCase();
    if (e.key === ' ') { e.preventDefault(); togglePause(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); stepModel(); }
    else if (k === 's') startModel();
    else if (k === 'x') stopModel();
    else if (k === 'r') tripResetCommand();
  });

  window.addEventListener('resize', resizeAll);
  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(() => resizeAll());
    [E.machine, E.vectors, E.graph, E.ccChart, E.ccTiming].forEach(c => ro.observe(c));
  }
}

/* ---------- start-up ---------- */

function initialize() {
  collectElements();
  loadPalette();
  const stored = loadStored();
  if (stored) {
    if (stored.lang && I18N[stored.lang]) LANG = stored.lang;
    if (stored.layers) Object.assign(App.layers, stored.layers);
    if (Array.isArray(stored.selected)) App.view.selected = new Set(stored.selected.filter(k => SIGNALS.some(d => d.key === k)));
    if (WINDOWS.includes(stored.window)) App.view.window = stored.window;
    if (typeof stored.yAuto === 'boolean') App.view.yAuto = stored.yAuto;
    if (CC_WINDOWS.includes(stored.ccWindow)) ccView.window = stored.ccWindow;
  }
  const defaults = defaultSettings(), settings = {};
  if (stored && stored.settings) for (const k of SETTING_KEYS) if (k in stored.settings && typeof stored.settings[k] === typeof defaults[k]) settings[k] = stored.settings[k];
  if (settings.poles !== undefined) settings.poles = clamp(Math.round(settings.poles / POLE_STEP) * POLE_STEP, POLE_MIN, POLE_MAX);
  App.S = createState(settings);
  App.H = createHistory();
  App.S.particles = createParticles(App.S);
  App.S.signals = computeSignals(App.S);
  clearHistory(App.S, App.H);

  buildParamControls();
  buildAnnunciator();
  buildReadouts();
  const E = App.E;
  E.window.value = Math.max(0, WINDOWS.indexOf(App.view.window));
  E.ccWindow.value = Math.max(0, CC_WINDOWS.indexOf(ccView.window));
  E.yAuto.checked = App.view.yAuto;
  document.querySelectorAll('input[name=angleMode]').forEach(r => { r.checked = r.value === App.S.angleMode; });
  for (const [layer, id] of Object.entries(LAYER_IDS)) E[id].checked = App.layers[layer];

  registerEvents();
  applyLanguage();
  requestAnimationFrame(frame);
  E.enter.focus({ preventScroll: true });
}

initialize();
})();
</script>
