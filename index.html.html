<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMD mill learning simulator</title>
<style>
/* ==========================================================================
 * styles.css — one visual system for the whole simulator.
 * Direction: industrial red / black / white. Black and graphite carry the
 * structure, white carries text, signal red marks primary actions and trips.
 * Amber is kept only for "trip pending". Every colour is a token below; the
 * canvases read the same tokens at start-up.
 * ========================================================================== */

:root {
  color-scheme: dark;
  /* neutrals */
  --bg: #0d0d0d;
  --surface: #171717;
  --surface-2: #202020;
  --inset: #080808;
  --line: #2b2b2b;
  --line-strong: #454545;
  --text: #ffffff;
  --muted: #b3b3b3;
  --dim: #767676;
  /* accent */
  --red: #ff000f;
  --red-dark: #b0000a;
  --red-tint: #2a0507;
  /* interaction */
  --control: #ffffff;
  --control-strong: #ffffff;
  --control-fill: #232323;
  /* state */
  --run: #ffffff;
  --pending: #ffb000;
  --pending-bg: #2c2005;
  --trip: #ff000f;
  --trip-bg: #3a0306;
  /* signals (canvas + legends) */
  --sig-phaseA: #ff5c5c; --sig-phaseB: #6fd08c; --sig-phaseC: #5aa6ff;
  --sig-phaseAlight: #ffaaa6; --sig-phaseBlight: #ade6bd; --sig-phaseClight: #a9ccff;
  --sig-voltage: #e8e8e8; --sig-alpha: #ffab5e; --sig-beta: #c99bff; --sig-d: #ffd75e; --sig-q: #4fd6c6;
  --sig-rotor: #ffc83d; --sig-stator: #6cc6ff; --sig-rotorVoltage: #d79bff; --sig-flux: #ff6fa8; --sig-psi: #ffa9cf;
  --sig-cosPhi: #4fe0ff; --sig-power: #ffffff; --sig-returnPower: #e8c14d; --sig-throughput: #c79d74;
  --sig-speed: #8fdcff; --sig-speedRef: #7a9bb0; --sig-torque: #ff8ed1; --sig-chargeTorque: #b58cff;
  /* material */
  --steel-1: #6b6b6b; --steel-2: #3d3d3d; --steel-3: #262626; --copper: #b8733a;
  --pole-n: #e0101c; --pole-s: #9a9a9a; --ore-1: #9a948a; --ore-2: #7d776e; --ore-3: #b9b2a6;
  /* type & shape */
  --font: "ABBvoice", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --radius: 2px;
  --gap: 10px;
  font-family: var(--font);
  font-variant-numeric: tabular-nums;
  background: var(--bg);
  color: var(--text);
}

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); }
body.on-welcome { overflow: hidden; }
h1, h2, h3 { font-weight: 700; margin: 0; }
h1 { font-size: 19px; letter-spacing: -.01em; }
h2 { font-size: 14px; }
h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
p { margin: 0; }
[hidden] { display: none !important; }
.hint { font-size: 11.5px; color: var(--muted); line-height: 1.5; margin-top: 8px; max-width: 72ch; }
.hint.monitor { color: var(--text); font-variant-numeric: tabular-nums; }

/* brand mark: a red square with a white ring motor cut-out; no third-party logo */
.brand-mark { width: 30px; height: 30px; flex: none; background: var(--red); position: relative; display: inline-block; }
.brand-mark::before { content: ""; position: absolute; inset: 7px; border: 3px solid #fff; border-radius: 50%; }
.brand-mark::after { content: ""; position: absolute; left: 13px; top: 13px; width: 4px; height: 4px; background: #fff; border-radius: 50%; }

/* ---------- page transitions ---------- */
.fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 100; transition: opacity .38s ease; }
.fade.on { opacity: 1; pointer-events: all; }
@media (prefers-reduced-motion: reduce) { .fade { transition-duration: .01s; } }

/* ---------- welcome ---------- */
.welcome { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; overflow: auto; background: #000; }
.welcome-bg { position: absolute; inset: -40px; background-size: cover; background-position: center 30%; filter: blur(14px) saturate(.9) brightness(.55); transform: scale(1.06); }
.welcome::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(0,0,0,.88) 0%, rgba(0,0,0,.55) 55%, rgba(0,0,0,.25) 100%); }
.welcome-card { position: relative; z-index: 1; width: min(640px, 100%); padding: 32px 36px 30px; background: rgba(10, 10, 10, .78); border-top: 4px solid var(--red); backdrop-filter: blur(4px); justify-self: start; margin-left: max(0px, 6vw); }
.welcome-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
.welcome h1 { font-size: 34px; line-height: 1.1; letter-spacing: -.02em; max-width: 18ch; }
.welcome-lead { color: var(--muted); font-size: 15px; line-height: 1.5; margin-top: 10px; max-width: 54ch; }
.welcome-steps { margin: 22px 0 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 12px; }
.welcome-steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; font-size: 14px; line-height: 1.5; color: #e6e6e6; }
.welcome-steps li::before { content: counter(s); width: 24px; height: 24px; display: grid; place-items: center; background: var(--red); color: #fff; font-weight: 700; font-size: 12.5px; margin-top: 1px; }
.welcome-keys { margin-top: 20px; font-size: 12.5px; color: var(--muted); }
.welcome-note { margin-top: 8px; font-size: 12px; color: var(--dim); line-height: 1.5; }
button.big { margin-top: 24px; padding: 12px 28px; font-size: 15px; }

/* ---------- top bar ---------- */
.topbar {
  display: grid; grid-template-columns: minmax(240px, auto) 1fr auto; align-items: center; gap: 16px;
  padding: 10px 14px; background: #000; border-bottom: 3px solid var(--red);
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand p { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.top-right { display: flex; align-items: center; gap: 8px; }
.status-pill {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid var(--line-strong);
  font-size: 13px; font-weight: 700; min-width: 134px; justify-content: center; white-space: nowrap;
}
.status-pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
.status-pill[data-state=running]::before { background: #fff; box-shadow: 0 0 6px #fff; }
.status-pill[data-state=pending] { border-color: var(--pending); color: var(--pending); }
.status-pill[data-state=pending]::before { background: var(--pending); }
.status-pill[data-state=tripped] { border-color: var(--trip); background: var(--trip); color: #fff; }
.status-pill[data-state=tripped]::before { background: #fff; }

/* ---------- protection annunciator ---------- */
.annunciator { display: grid; grid-template-columns: repeat(8, minmax(62px, 1fr)); gap: 3px; max-width: 760px; justify-self: center; width: 100%; }
.ann {
  position: relative; overflow: hidden; border: 1px solid var(--line); background: var(--surface);
  height: 30px; padding: 0 6px; display: flex; align-items: center; justify-content: center; gap: 5px;
  font-size: 11.5px; color: var(--muted); text-align: center; cursor: default; white-space: nowrap;
}
.ann .lamp { width: 6px; height: 6px; border-radius: 50%; background: #3a3a3a; flex: none; }
.ann b { display: none; font-weight: 700; }
.ann .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--pending); }
.ann[data-state=pending] { border-color: var(--pending); color: var(--pending); background: var(--pending-bg); }
.ann[data-state=pending] .lamp { background: var(--pending); }
.ann[data-state=pending] b, .ann[data-state=tripped] b { display: inline; }
.ann[data-state=tripped] { border-color: var(--trip); color: #fff; background: var(--trip); font-weight: 700; }
.ann[data-state=tripped] .lamp { background: #fff; }
.ann[data-state=active] { border-color: #6b5200; color: var(--pending); }
@media (prefers-reduced-motion: no-preference) {
  .ann[data-state=tripped].fresh { animation: blink .5s steps(1) 6; }
  @keyframes blink { 50% { background: var(--trip-bg); } }
}

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr) 236px; gap: var(--gap); padding: var(--gap); align-items: start; }
.sidebar { position: sticky; top: 64px; max-height: calc(100vh - 74px); overflow: auto; scrollbar-width: thin; }
.content { min-width: 0; display: grid; gap: var(--gap); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
.sidebar .panel + .panel { margin-top: var(--gap); }
.panel > header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; padding-left: 8px; border-left: 3px solid var(--red); }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
.two-col > * { min-width: 0; }

/* collapsible panels */
details.fold { padding: 0; }
details.fold > summary { padding: 12px; font-size: 14px; font-weight: 700; color: var(--text); border-left: 3px solid var(--red); }
details.fold > summary:hover { background: var(--surface-2); }
details.fold[open] > summary { border-bottom: 1px solid var(--line); }
details.fold > :not(summary) { margin-left: 12px; margin-right: 12px; }
details.fold > :last-child { margin-bottom: 12px; }
details.fold > .params { margin-top: 12px; }

/* ---------- controls ---------- */
button, select, input { font: inherit; color: inherit; }
button {
  background: var(--control-fill); border: 1px solid var(--line-strong); border-radius: var(--radius);
  padding: 7px 10px; font-size: 12.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button:hover:not(:disabled) { border-color: #fff; }
button:disabled { opacity: .35; cursor: not-allowed; }
button.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }
button.primary:hover:not(:disabled) { background: #e0000d; border-color: #fff; }
button.ghost { background: transparent; }
button.danger-outline { border-color: var(--red-dark); }
button svg { width: 12px; height: 12px; fill: currentColor; flex: none; }
.button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
select, input[type=number] { background: var(--inset); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 5px 7px; font-size: 12.5px; }
input[type=number] { width: 76px; text-align: right; }
:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }

.field { margin-top: 12px; }
.params > .field:first-child { margin-top: 0; }
.field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 12.5px; color: var(--muted); }
.field-head output { color: var(--text); font-weight: 700; white-space: nowrap; }
.field-row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.field-row input[type=range] { flex: 1; }
.field.disabled .field-head { opacity: .55; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 3px; background: var(--line-strong); }
input[type=range]::-moz-range-track { height: 3px; background: var(--line-strong); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 16px; margin-top: -6.5px; background: #fff; border: 0; box-shadow: inset 0 -3px 0 var(--red); }
input[type=range]::-moz-range-thumb { width: 12px; height: 16px; background: #fff; border: 0; border-radius: 0; box-shadow: inset 0 -3px 0 var(--red); }
input[type=range]:disabled { opacity: .4; }
input[type=checkbox], input[type=radio] { accent-color: var(--red); margin: 0; }

.choices { display: grid; gap: 6px; font-size: 12.5px; }
.choices label, .check { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 12.5px; }
.segmented { display: inline-flex; border: 1px solid var(--line-strong); overflow: hidden; }
.segmented label { padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--muted); position: relative; }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented label:has(input:checked) { background: #fff; color: #000; font-weight: 700; }
.segmented label:has(input:disabled) { cursor: not-allowed; opacity: .5; }
.segmented label:has(input:focus-visible) { outline: 2px solid #fff; }

.tripbox { white-space: pre-line; margin-top: 10px; padding: 8px 10px; background: var(--inset); border: 1px solid var(--line); font-size: 12px; min-height: 34px; }
.tripbox[data-state=pending] { border-color: var(--pending); color: var(--pending); }
.tripbox[data-state=tripped] { border-color: var(--trip); background: var(--trip-bg); color: #fff; }

details { margin-top: 10px; }
details.fold, details#ccPanel { margin-top: 0; }
details > summary { cursor: pointer; font-size: 12.5px; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::before { content: ""; width: 0; height: 0; border-left: 5px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .15s; }
details[open] > summary::before { transform: rotate(90deg); }
table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 6px; }
th { color: var(--dim); font-weight: 400; text-align: left; }
td, th { padding: 4px 3px; border-bottom: 1px solid var(--line); }
td:not(:first-child), th:not(:first-child) { text-align: right; white-space: nowrap; }

/* ---------- canvases ---------- */
.stage { position: relative; aspect-ratio: 1; background: var(--inset); border: 1px solid var(--line); overflow: hidden; min-width: 0; }
.graph { position: relative; height: 340px; background: var(--inset); border: 1px solid var(--line); cursor: crosshair; touch-action: pan-y; min-width: 0; }
canvas { display: block; width: 100%; height: 100%; max-width: 100%; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 8px; }
.toolbar .field { margin: 0; flex: 1 1 220px; }
.toolbar .actions { display: flex; gap: 6px; }

/* ---------- read-outs ---------- */
.kv-list { display: grid; }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 4px 2px; border-bottom: 1px solid var(--line); font-size: 12px; }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--muted); min-width: 0; }
.kv b { font-weight: 700; white-space: nowrap; }
.kv small { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 3px; }
.kv[data-state=pending] b { color: var(--pending); }
.kv[data-state=tripped] b { color: var(--trip); }
.kv.status { padding: 6px 8px; margin-bottom: 4px; background: var(--inset); border: 1px solid var(--line); font-size: 13px; }
.kv.status[data-state=tripped] { border-color: var(--trip); }

.readouts.vector { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; margin-top: 8px; }
.cell { background: var(--inset); border: 1px solid var(--line); padding: 4px 6px; min-width: 0; }
.cell span { display: block; font-size: 10.5px; color: var(--dim); }
.cell strong { display: block; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.note { padding: 9px 11px; background: var(--inset); border-left: 3px solid var(--line-strong); color: var(--muted); font-size: 11.5px; line-height: 1.5; margin-top: 8px; }
.note.caution { border-left-color: var(--red); }
.cursor-line { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 1.5em; overflow-wrap: anywhere; }
.cursor-line b { color: var(--text); font-weight: 700; }
.slow-banner { display: none; margin-top: 8px; font-size: 11.5px; color: var(--pending); }
.slow-banner.visible { display: block; }

.groups { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.group { border: 1px solid var(--line); padding: 7px 8px; background: var(--inset); }
.signal { display: grid; grid-template-columns: auto 14px 1fr; align-items: start; gap: 6px; margin: 5px 0; font-size: 12px; cursor: pointer; }
.signal input { margin-top: 2px; }
.swatch { height: 3px; margin-top: 7px; }
.signal small { display: block; color: var(--dim); font-size: 10.5px; line-height: 1.35; }

.tooltip {
  display: none; position: fixed; z-index: 120; max-width: 320px; background: #fff; color: #000;
  border-left: 4px solid #000; padding: 8px 10px; font-size: 12px; line-height: 1.45;
  white-space: pre-line; pointer-events: none; box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
}
.tooltip.trip { border-left-color: var(--red); }
.toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 110; transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  background: #fff; color: #000; border-left: 4px solid var(--red); padding: 11px 18px; font-size: 14px; font-weight: 700;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .5); transition: opacity .25s ease, transform .25s ease;
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

/* ---------- thyristors control ---------- */
.cc-status { margin-top: 8px; font-size: 12.5px; color: var(--text); }
.cc-box { min-width: 0; border: 1px solid var(--line); padding: 10px; background: var(--inset); }
.cc-box h3 { margin: 0 0 8px; }
.cc-scroll { overflow: auto; }
.cc-full { margin-top: var(--gap); }
.cc-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 16px; margin-bottom: 8px; }
.cc-head h3 { flex: 1 1 100%; margin: 0; }
.cc-head .field { margin: 0; flex: 1 1 240px; }
.cc-sub { margin-top: 16px !important; }
.cc-timing { height: 220px; cursor: crosshair; touch-action: pan-y; }
.cc-chart { height: 260px; touch-action: pan-y; }
.cc-cab { display: flex; flex-wrap: wrap; gap: 6px; }
.cc-cab-phase { flex: 1; min-width: 120px; background: var(--surface); border: 1px solid var(--line-strong); padding: 6px; font-size: 12px; }
.cc-cab-group { margin-top: 6px; color: var(--muted); font-size: 11px; }
.cc-cab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 3px; }
.cc-valve { text-align: center; border: 1px solid var(--line-strong); padding: 2px; font-size: 11px; color: var(--muted); background: var(--inset); }
.cc-valve.on { border-color: #fff; color: #000; background: #fff; font-weight: 700; }
.cc-checks { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; margin-top: 6px; }
.cc-checks label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }

/* ---------- responsive ---------- */
@media (max-width: 1360px) {
  .layout { grid-template-columns: 230px minmax(0, 1fr); }
  .sidebar.right { position: static; max-height: none; grid-column: 1 / -1; display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap); }
  .sidebar.right .panel + .panel { margin-top: 0; }
  .sidebar.right .kv-list { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 18px; }
}
@media (max-width: 1100px) {
  .topbar { grid-template-columns: 1fr auto; }
  .annunciator { grid-column: 1 / -1; grid-row: 2; max-width: none; }
}
@media (max-width: 800px) {
  .layout, .two-col, .groups, .sidebar.right { grid-template-columns: 1fr; }
  .sidebar { position: static; max-height: none; }
  .annunciator { grid-template-columns: repeat(4, 1fr); }
  .readouts.vector { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sidebar.right .kv-list { grid-template-columns: 1fr; }
  .graph { height: 260px; }
  .topbar { position: static; }
  .welcome-card { padding: 24px 20px; margin-left: 0; }
  .welcome h1 { font-size: 26px; }
}

</style>
</head>
<body class="on-welcome">

<!-- ===================== main application ===================== -->
<div id="app" class="app" hidden>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div><h1 data-i="title"></h1><p data-i="subtitle"></p></div>
  </div>
  <div id="annunciator" class="annunciator" role="status" aria-live="polite"></div>
  <div class="top-right">
    <div id="statusPill" class="status-pill" role="status"></div>
    <button id="help" class="ghost" data-i="help"></button>
    <select id="language" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option></select>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <section class="panel">
      <header><h2 data-i="simulation"></h2></header>
      <div class="button-grid">
        <button id="start" class="primary"><svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z"/></svg><span data-i="start"></span></button>
        <button id="stop"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8"/></svg><span data-i="stop"></span></button>
        <button id="pause"><svg viewBox="0 0 12 12"><rect x="2" y="1.5" width="3" height="9"/><rect x="7" y="1.5" width="3" height="9"/></svg><span id="pauseText"></span></button>
        <button id="step"><svg viewBox="0 0 12 12"><path d="M1.5 1.5l6 4.5-6 4.5z"/><rect x="8.5" y="1.5" width="2" height="9"/></svg><span data-i="step"></span></button>
        <button id="tripReset" class="danger-outline"><span data-i="tripReset"></span></button>
        <button id="reset"><span data-i="reset"></span></button>
      </div>
      <div id="tripStatus" class="tripbox" role="status"></div>
      <p class="hint" data-i="tripHint"></p>
    </section>

    <section class="panel">
      <header><h2 data-i="settings"></h2></header>
      <div class="params" data-panel="operation"></div>
      <p id="slowBanner" class="slow-banner" data-i="slowFrame"></p>
    </section>

    <section class="panel">
      <header><h2 data-i="configuration"></h2></header>
      <div class="params" data-panel="configuration"></div>
      <details>
        <summary data-i="limits"></summary>
        <table><thead><tr><th data-i="parameter"></th><th data-i="nominal"></th><th data-i="tripThreshold"></th></tr></thead><tbody id="limitRows"></tbody></table>
        <p class="hint" data-i="limitsHint"></p>
      </details>
    </section>

    <section class="panel">
      <header><h2 data-i="position"></h2></header>
      <div class="field">
        <div class="field-head"><label for="angle" data-i="mechanicalAngle"></label><output id="angleLabel"></output></div>
        <div class="field-row"><input id="angle" type="range" min="0" max="360" step="0.1"><input id="angleNumber" type="number" min="0" max="360" step="0.1" aria-label="°"></div>
      </div>
      <p class="hint"><span data-i="electricalAngle"></span>: <b id="electricalAngle"></b></p>
      <div class="choices" style="margin-top:8px">
        <label><input type="radio" name="angleMode" value="stationary"> <span data-i="holdStationary"></span></label>
        <label><input type="radio" name="angleMode" value="dq"> <span data-i="holdDq"></span></label>
      </div>
      <p class="hint" data-i="angleHint"></p>
    </section>
  </aside>

  <main class="content">
    <div class="two-col">
      <section class="panel">
        <header><h2 data-i="machine"></h2></header>
        <div class="stage"><canvas id="machine"></canvas></div>
        <p class="note" data-i="machineHelp"></p>
      </section>
      <section class="panel">
        <header><h2 data-i="vectors"></h2></header>

<script>
'use strict';
(() => {
/* ==========================================================================
 * config.js — constants, invented machine scaling and signal catalogue.
 * Educational, offline-only model. None of the values or protection logic
 * is suitable for real equipment.
 * ========================================================================== */

const TWO_PI = 2 * Math.PI;

/** Fixed model integration step, s. */
const DT = 0.001;
/** Particle (material) integration step, s. */
const PARTICLE_DT = 0.005;
/** Trend sampling period, s. */
const SAMPLE_DT = 0.02;
/** Trend retention, s. */
const MAX_HISTORY = 300.1;
/** Continuous time a protection condition must persist before tripping, s. */
const TRIP_DELAY = 1;

/** Reference configuration: invented values the scaling is built around. */
const REF_POLES = 28;
const REF_POWER = 22;          // MW at REF_POLES
const REF_LOAD = 5000;         // t/h at REF_POLES
const NOMINAL_SPEED = 12;      // rpm
const MAX_SPEED = 18;          // rpm, setpoint range
const RETURN_EFFICIENCY = 0.85;

/** Pole-pair range offered by the configuration slider. */
const POLE_MIN = 12;
const POLE_MAX = 40;
const POLE_STEP = 2;

/** Stator current limit used by the speed controller, × nominal. Below the trip level. */
const STATOR_CURRENT_LIMIT = 1.0;
/** Armature-reaction coefficient used in the simplified voltage / flux equations. */
const ARMATURE_REACTION = 0.35;
/** Stator resistance coefficient, pu. */
const STATOR_RESISTANCE = 0.08;
/** Rotor flux saturation shape. */
const SATURATION = 1.6;

/** Graph time windows, s. */
const WINDOWS = [0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 20, 30, 60, 120, 180, 300];

/** Animation multiplier range (log10). */
const ANIMATION_LOG_MIN = -3;
const ANIMATION_LOG_MAX = Math.log10(20);

/**
 * Computes invented nominal values and protection thresholds for a pole-pair count.
 * Power, load, stator current and torque scale with pole-pair count.
 */
function configuration(poles) {
  const ratio = poles / REF_POLES;
  const nominal = {
    speed: NOMINAL_SPEED,
    load: REF_LOAD * ratio,
    power: REF_POWER * ratio,
    statorCurrent: ratio,
    statorVoltage: 1,
    rotorCurrent: 1,
    rotorVoltage: 1,
    flux: 1,
    torque: ratio,
    frequency: poles * NOMINAL_SPEED / 60,
    unit: 1,
  };
  const trip = {
    speed: nominal.speed * 1.2,
    load: nominal.load * 1.2,
    power: nominal.power * 1.2,
    statorCurrent: nominal.statorCurrent * 1.2,
    statorVoltage: 1.12,
    rotorCurrent: 1.2,
    rotorVoltage: 1.2,
    airgapFlux: 1.1,
  };
  return { ratio, nominal, trip, pulses: poles >= 20 ? 12 : 6 };
}

/* ==========================================================================
 * model.js — machine state, coordinate transforms, controllers and mechanics.
 * Pure model code: no DOM access. Everything here runs in the browser and
 * in the Node test harness.
 * ========================================================================== */

/* ---------- small math helpers ---------- */

/** Restricts a value to an inclusive range. */
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
/** Wraps a value into [0, max). */
function wrap(v, max) { return ((v % max) + max) % max; }
/** Wraps an angle into (-π, π]. */
function wrapPi(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }

/* ---------- transforms ---------- */

/** Balanced phase currents → amplitude-invariant Clarke α/β (+ zero sequence). */
function clarke(a, b, c) {
  return { alpha: 2 / 3 * (a - 0.5 * b - 0.5 * c), beta: 2 / 3 * (Math.sqrt(3) / 2) * (b - c), zero: (a + b + c) / 3 };
}
/** Inverse Clarke: α/β → phase quantities. */
function inverseClarke(alpha, beta) {
  return [alpha, -0.5 * alpha + Math.sqrt(3) / 2 * beta, -0.5 * alpha - Math.sqrt(3) / 2 * beta];
}
/** Stationary α/β → rotor-frame d/q. */
function park(alpha, beta, angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  return { d: alpha * c + beta * s, q: -alpha * s + beta * c };
}
/** Rotor-frame d/q → stationary α/β. */
function inversePark(d, q, angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  return { alpha: d * c - q * s, beta: d * s + q * c };
}

/* ---------- rotor flux ---------- */

const SAT_NORM = Math.tanh(SATURATION);
/** Saturated rotor flux, pu, for a rotor current. */
function fluxFromCurrent(ir) { return Math.tanh(SATURATION * ir) / SAT_NORM; }
/** Rotor current that produces a flux (inverse of fluxFromCurrent). */
function currentForFlux(flux) { return Math.atanh(clamp(flux * SAT_NORM, 0, 0.9999)) / SATURATION; }

/* ---------- state ---------- */

/** Creates a fresh model state. */
function createState(settings) {
  const s = Object.assign(defaultSettings(), settings || {});
  return Object.assign(s, {
    run: false, paused: true, tripped: false, tripReason: null,
    time: 0, angle: 0, speed: 0, speedRef: 0, ir: 0, ur: 0, flux: 0, id: 0, iq: 0, idCmdPu: 0,
    torque: 0, chargeTorque: 0, power: 0, returnPower: 0,
    speedIntegral: 0, rotorIntegral: 0, targetId: 0, targetIq: 0, targetIr: 0,
    timers: {}, events: [], particles: [], particleAccumulator: 0, chargeLever: 0, signals: null,
  });
}

/** Clears every dynamic quantity of a state, keeping settings. */
function resetDynamics(S) {
  Object.assign(S, {
    run: false, paused: true, tripped: false, tripReason: null,
    time: 0, angle: 0, speed: 0, speedRef: 0, ir: 0, ur: 0, flux: 0, id: 0, iq: 0, idCmdPu: 0,
    torque: 0, chargeTorque: 0, power: 0, returnPower: 0,
    speedIntegral: 0, rotorIntegral: 0, targetId: 0, targetIq: 0, targetIr: 0,
    timers: {}, events: [], particleAccumulator: 0, chargeLever: 0,
  });
}

/* ---------- simplified stator voltage model ---------- */

/**
 * Stator voltage in the rotor frame, pu:
 *   Ud = Rs·Id − ω·Xa·Iq,  Uq = Rs·Iq + ω·(Φ + Xa·Id),  ω = n / n_nom
 * Currents are given as fractions of nominal stator current.
 */
function statorVoltage(idpu, iqpu, flux, speed) {
  const w = speed / NOMINAL_SPEED;
  return {
    ud: STATOR_RESISTANCE * idpu - ARMATURE_REACTION * w * iqpu,
    uq: STATOR_RESISTANCE * iqpu + w * (flux + ARMATURE_REACTION * idpu),
  };
}

/** Air-gap flux components, pu. */
function airgapFlux(idpu, iqpu, flux) {
  const d = flux + ARMATURE_REACTION * idpu, q = ARMATURE_REACTION * iqpu;
  return { d, q, mag: Math.hypot(d, q) };
}

/**
 * Signed angle φ from U to I, positive when current leads, for the direction of rotation.
 * The sign is mirrored for negative electrical frequency so that "lag" keeps its meaning
 * in reverse. Returns null when U or I is negligible.
 */
function phaseAngle(ud, uq, idpu, iqpu, speed) {
  const um = Math.hypot(ud, uq), im = Math.hypot(idpu, iqpu);
  if (um < 1e-4 || im < 1e-4) return null;
  const raw = Math.atan2(ud * iqpu - uq * idpu, ud * idpu + uq * iqpu);
  return speed < 0 ? -raw : raw;
}

/* ---------- electrical snapshot ---------- */

/**
 * Derived electrical quantities shared by signals, read-outs, protections and drawings.
 * Computed once per step; subsystems read from it instead of recomputing transforms.
 */
function computeElectrical(S) {
  const cfg = configuration(S.poles), base = cfg.nominal.statorCurrent;
  const e = S.poles * S.angle;
  const v = inversePark(S.id, S.iq, e);
  const [ia, ib, ic] = inverseClarke(v.alpha, v.beta);
  const ab = clarke(ia, ib, ic);
  const dq = park(ab.alpha, ab.beta, e);
  const idpu = dq.d / base, iqpu = dq.q / base;
  const u = statorVoltage(idpu, iqpu, S.flux, S.speed);
  const uab = inversePark(u.ud, u.uq, e);
  const [ua, ub, uc] = inverseClarke(uab.alpha, uab.beta);
  const phi = phaseAngle(u.ud, u.uq, idpu, iqpu, S.speed);
  return {
    cfg, base, ia, ib, ic, ua, ub, uc, umag: Math.hypot(u.ud, u.uq), ualpha: uab.alpha, ubeta: uab.beta, ud: u.ud, uq: u.uq,
    phi, cosPhi: phi === null ? null : Math.cos(phi),
    alpha: ab.alpha, beta: ab.beta, zero: ab.zero, id: dq.d, iq: dq.q, imag: Math.hypot(ab.alpha, ab.beta),
    psi: airgapFlux(idpu, iqpu, S.flux).mag, frequency: S.poles * S.speed / 60,
  };
}

/* ---------- controllers ---------- */

/** PI step with conditional-integration anti-windup. Returns {output, integral}. */
function piStep(kp, ki, error, integral, dt, lo, hi) {
  const candidate = integral + ki * error * dt;
  const raw = kp * error + candidate;
  const output = clamp(raw, lo, hi);
  const saturatedHigh = raw > hi, saturatedLow = raw < lo;
  const keep = (!saturatedHigh && !saturatedLow) || (saturatedHigh && error < 0) || (saturatedLow && error > 0);
  return { output, integral: keep ? clamp(candidate, lo, hi) : integral };
}

/**
 * Rotor excitation: PI on rotor current, output = rotor voltage.
 * Automatic target follows nominal flux with field weakening above nominal speed.
 */
function updateRotor(S, dt) {
  const active = S.run && !S.tripped;
  if (!active) S.targetIr = 0;
  else if (S.rotorMode === 'manual') S.targetIr = S.manualIr;
  else {
    const w = Math.abs(S.speed) / NOMINAL_SPEED;
    S.targetIr = currentForFlux(Math.min(1, 1 / Math.max(w, 1e-6)));
  }
  if (!active) { S.rotorIntegral = 0; S.ur = 0; }
  else {
    const r = piStep(S.rotorKp, S.rotorKi, S.targetIr - S.ir, S.rotorIntegral, dt, 0, 1.5);
    S.rotorIntegral = r.integral; S.ur = r.output;
  }
  const equilibrium = Math.max(0, S.ur / S.resistance);
  S.ir = Math.max(0, S.ir + (equilibrium - S.ir) * dt / (S.run ? 1.5 : 2));
  S.flux = fluxFromCurrent(S.ir);
}

/**
 * Stator current control.
 *  Automatic: speed setpoint ramp → speed PI → Iq*, cos φ PI → Id*,
 *             vector current limit with Id priority.
 *  Manual: Id*, Iq* given as fractions of nominal current.
 * The actual current follows the command with a 0.25 s lag.
 */
function updateStator(S, dt) {
  const cfg = configuration(S.poles), base = cfg.nominal.statorCurrent;
  let idpu = 0, iqpu = 0;
  const active = S.run && !S.tripped;

  // The speed reference ramps only while running with established excitation.
  let rampRate = 0;
  if (!active || S.statorMode !== 'auto') S.speedRef = S.speed;
  else if (S.flux >= 0.5) {
    const step = Math.max(0.01, S.ramp) * dt, delta = clamp(S.speedTarget - S.speedRef, -step, step);
    S.speedRef += delta; rampRate = delta / dt;
  }

  if (!active) { S.speedIntegral = 0; S.idCmdPu = 0; }
  else if (S.statorMode === 'manual') { idpu = S.manualId; iqpu = S.manualIq; }
  else if (S.flux >= 0.1) {
    // cos φ regulator on the d-axis current. φ is measured against ±I so that
    // the regulator also works while regenerating.
    const u = statorVoltage(S.id / base, S.iq / base, S.flux, S.speed);
    const sign = (u.ud * S.id + u.uq * S.iq) < 0 ? -1 : 1;
    const phi = phaseAngle(u.ud, u.uq, sign * S.id / base, sign * S.iq / base, S.speed);
    if (phi !== null && Math.abs(S.speed) > 0.05) {
      const target = Math.acos(clamp(S.cosPhiTarget, 0, 1)) * (S.cosPhiSense === 'lead' ? 1 : -1);
      S.idCmdPu = clamp(S.idCmdPu + 1.5 * wrapPi(phi - target) * dt, -0.7, 0.3);
    } else S.idCmdPu *= Math.max(0, 1 - dt / 0.5);
    idpu = S.idCmdPu;
    const iqLimit = Math.sqrt(Math.max(0, STATOR_CURRENT_LIMIT ** 2 - idpu ** 2));
    // Acceleration feed-forward: torque needed to follow the ramp, as Iq fraction.
    const feedForward = S.inertia * rampRate / (1.8 * Math.max(S.flux, 0.1));
    const r = piStep(S.statorKp, S.statorKi, S.speedRef - S.speed, S.speedIntegral, dt, -iqLimit - feedForward, iqLimit - feedForward);
    S.speedIntegral = r.integral; iqpu = clamp(r.output + feedForward, -iqLimit, iqLimit);
  }
  S.targetId = idpu * base; S.targetIq = iqpu * base;
  S.id += (S.targetId - S.id) * dt / 0.25;
  S.iq += (S.targetIq - S.iq) * dt / 0.25;
}

/**
 * Mechanics. Torques in absolute units (nominal torque = configuration ratio).
 *  Electromagnetic torque  M = Φ·Iq
 *  Charge torque           geometric, from the particle model (or a smooth formula)
 *  Friction                Coulomb + viscous, always opposing motion
 */
function updateMechanics(S, dt) {
  const cfg = configuration(S.poles), ratio = cfg.ratio;
  const loadFraction = S.load / Math.max(cfg.nominal.load, 1);
  S.torque = S.flux * S.iq;
  const chargeNominal = ratio * 0.62 * loadFraction;
  if (S.chargeCoupling) S.chargeTorque = chargeNominal * S.chargeLever / CHARGE_LEVER_REF;
  else S.chargeTorque = Math.abs(S.speed) < 0.002 ? 0 : Math.sign(S.speed) * chargeNominal;
  const staticFriction = ratio * 0.1;
  const friction = staticFriction + 0.04 * ratio * Math.abs(S.speed) / NOMINAL_SPEED;
  const drive = S.torque - S.chargeTorque;
  let net;
  if (Math.abs(S.speed) < 0.002) net = Math.abs(drive) <= staticFriction ? 0 : drive - Math.sign(drive) * staticFriction;
  else net = drive - Math.sign(S.speed) * friction;
  const previous = S.speed;
  let next = previous + net * 1.8 / (ratio * S.inertia) * dt;
  if (Math.abs(previous) < 0.002 && net === 0) next = 0;
  else if (previous !== 0 && Math.sign(previous) !== Math.sign(next) && Math.abs(drive) <= staticFriction) next = 0;
  S.speed = next;
  S.angle = wrap(S.angle + S.speed * TWO_PI / 60 * dt, TWO_PI);
  S.power = REF_POWER * S.torque * S.speed / NOMINAL_SPEED;
  S.returnPower = S.power < 0 ? -S.power * RETURN_EFFICIENCY : 0;
}

/* ==========================================================================
 * particles.js — simplified grinding-charge model inside the drum.
 * Coordinates are in units of the drum inner radius; +y points down
 * (screen convention), gravity acts along +y. Positive mill speed turns
 * the shell counter-clockwise on screen, lifting the charge on the right.
 * The charge lever (mean x of the particles) gives the load torque.
 * ========================================================================== */

const PARTICLE_RADIUS = 0.0275;
const PARTICLE_GRAVITY = 3.6;
/** Mean charge lever at nominal speed and load, measured with the test harness. */
const CHARGE_LEVER_REF = 0.584;

/** Desired particle count for a load fraction of nominal. */
function desiredParticles(S) {
  const nominal = configuration(S.poles).nominal.load;
  return Math.round(12 + 138 * clamp(S.load / Math.max(nominal, 1), 0, 1.5));
}

/** Creates a particle at a repeatable initial position near the drum bottom. */
function createParticle(i) {
  const columns = 15, row = Math.floor(i / columns), column = i % columns, r = PARTICLE_RADIUS;
  return { x: (column - (columns - 1) / 2) * r * 2.1, y: 0.82 - row * r * 2.1, vx: 0, vy: 0, radius: r, tone: i % 3 };
}

function createParticles(S) {
  const result = [];
  for (let i = 0; i < desiredParticles(S); i++) result.push(createParticle(i));
  return result;
}

/** Resolves contact between two particles (position correction + impulse with friction). */
function particleCollision(a, b) {
  let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  const minimum = a.radius + b.radius;
  if (d >= minimum) return;
  if (d < 1e-8) { dx = 1e-6; dy = 0; d = 1e-6; }
  const nx = dx / d, ny = dy / d, overlap = minimum - d;
  a.x -= nx * overlap * 0.5; a.y -= ny * overlap * 0.5;
  b.x += nx * overlap * 0.5; b.y += ny * overlap * 0.5;
  const rvx = b.vx - a.vx, rvy = b.vy - a.vy, normal = rvx * nx + rvy * ny;
  if (normal >= 0) return;
  const impulse = -1.05 * normal / 2;
  a.vx -= impulse * nx; a.vy -= impulse * ny; b.vx += impulse * nx; b.vy += impulse * ny;
  const tx = -ny, ty = nx, tangent = rvx * tx + rvy * ty;
  const friction = clamp(-tangent * 0.18, -impulse * 0.4, impulse * 0.4);
  a.vx -= friction * tx; a.vy -= friction * ty; b.vx += friction * tx; b.vy += friction * ty;
}

/** Contact with the rotating shell wall. */
function wallCollision(p, omega) {
  const d = Math.hypot(p.x, p.y), maximum = 1 - p.radius;
  if (d <= maximum || d < 1e-8) return;
  const nx = p.x / d, ny = p.y / d;
  p.x = nx * maximum; p.y = ny * maximum;
  const tx = -ny, ty = nx, wallX = omega * p.y, wallY = -omega * p.x;
  const normal = (p.vx - wallX) * nx + (p.vy - wallY) * ny;
  if (normal > 0) { p.vx -= 1.05 * normal * nx; p.vy -= 1.05 * normal * ny; }
  const tangent = (p.vx - wallX) * tx + (p.vy - wallY) * ty;
  p.vx -= tangent * 0.45 * tx; p.vy -= tangent * 0.45 * ty;
}

/* Uniform grid for neighbour search: cell size = particle diameter. */
const GRID_CELL = 2 * PARTICLE_RADIUS;
const GRID_N = Math.ceil(2 / GRID_CELL) + 2;
const gridHeads = new Int32Array(GRID_N * GRID_N);
let gridNext = new Int32Array(256);

function cellIndex(v) { return clamp(Math.floor((v + 1) / GRID_CELL) + 1, 0, GRID_N - 1); }

/** Resolves all particle pairs using the grid: O(n) instead of O(n²). */
function collideAll(list) {
  if (gridNext.length < list.length) gridNext = new Int32Array(list.length * 2);
  gridHeads.fill(-1);
  for (let i = 0; i < list.length; i++) {
    const c = cellIndex(list[i].y) * GRID_N + cellIndex(list[i].x);
    gridNext[i] = gridHeads[c]; gridHeads[c] = i;
  }
  for (let i = 0; i < list.length; i++) {
    const p = list[i], cx = cellIndex(p.x), cy = cellIndex(p.y);
    for (let oy = -1; oy <= 1; oy++) {
      const yy = cy + oy; if (yy < 0 || yy >= GRID_N) continue;
      for (let ox = -1; ox <= 1; ox++) {
        const xx = cx + ox; if (xx < 0 || xx >= GRID_N) continue;
        for (let j = gridHeads[yy * GRID_N + xx]; j !== -1; j = gridNext[j]) if (j > i) particleCollision(p, list[j]);
      }
    }
  }
}

/** Advances gravity, collisions and the charge lever by one particle step. */
function updateParticles(S, dt) {
  const desired = desiredParticles(S);
  while (S.particles.length < desired) S.particles.push(createParticle(S.particles.length));
  while (S.particles.length > desired) S.particles.pop();
  const omega = S.speed * TWO_PI / 60;
  for (const p of S.particles) {
    p.vy += PARTICLE_GRAVITY * dt; p.vx *= 0.9985; p.vy *= 0.9985;
    p.x += p.vx * dt; p.y += p.vy * dt;
    wallCollision(p, omega);
  }
  for (let pass = 0; pass < 2; pass++) {
    collideAll(S.particles);
    for (const p of S.particles) wallCollision(p, omega);
  }
  let sum = 0;
  for (const p of S.particles) sum += p.x;
  S.chargeLever = S.particles.length ? sum / S.particles.length : 0;
}

/* ==========================================================================
 * cyclo-model.js — educational one-way cycloconverter model.
 * Ideal six-pulse antiparallel bridges (two groups shifted by 30° form a
 * 12-pulse arrangement), fixed firing angle, no commutation overlap and no
 * real voltage modulation. The output frequency equals the main model's
 * electrical frequency f = p·n / 60. Pure model code: no DOM access.
 * ========================================================================== */

const CC = {
  history: [], max: 12000, dt: 0.0001, frequency: 50, alpha: 30,
  recording: false, checkState: {}, version: 0,
};

function ccReset() { CC.history = []; CC.version++; }

/** Signed output frequency, Hz — identical to the machine electrical frequency. */
function ccOutputHz(S) { return S.poles * S.speed / 60; }

/** Electrical angle at a time slightly after the current model time. */
function ccPhaseAt(S, t) { return S.poles * S.angle + TWO_PI * ccOutputHz(S) * (t - S.time); }

/** Phase current setpoints at time t (from the Id* and Iq* commands). */
function ccTargets(S, t) {
  const v = inversePark(S.targetId, S.targetIq, ccPhaseAt(S, t));
  return inverseClarke(v.alpha, v.beta);
}

/**
 * State of one six-pulse bridge pair: the conducting supply pair changes at natural
 * line-voltage crossings delayed by the firing angle α. P conducts positive current,
 * N negative current.
 */
function ccBridge(S, t, shift, current) {
  if (!S.run || S.tripped || Math.abs(current) < 1e-5) return { p: -1, n: -1, gate: -1, sector: -1, group: 0 };
  const x = wrap(TWO_PI * CC.frequency * t + shift - Math.PI / 6 - CC.alpha * Math.PI / 180, TWO_PI);
  const sector = Math.floor(x / (Math.PI / 3)) % 6;
  const pairs = [[0, 1], [0, 2], [1, 2], [1, 0], [2, 0], [2, 1]];
  const within = x % (Math.PI / 3);
  return {
    p: pairs[sector][0], n: pairs[sector][1],
    gate: within < TWO_PI * CC.frequency * CC.dt ? sector : -1,
    sector, group: current > 0 ? 1 : -1,
  };
}

/** Complete converter snapshot at time t. */
function ccSnapshot(S, t) {
  const target = ccTargets(S, t), groups = configuration(S.poles).pulses === 12 ? 2 : 1;
  const states = [], currents = [];
  for (let out = 0; out < 3; out++) {
    states[out] = [];
    for (let g = 0; g < groups; g++) {
      const b = ccBridge(S, t, g ? -Math.PI / 6 : 0, target[out]), i = Math.abs(target[out]) / groups, c = [0, 0, 0];
      states[out][g] = b;
      if (b.p >= 0) { c[b.p] += i; c[b.n] -= i; }
      currents.push(c);
    }
  }
  return { t, target, states, currents, groups };
}

/** Model hook: records ten 0.1 ms snapshots covering the next model step while recording. */
function ccRecord(S) {
  if (!CC.recording) return;
  for (let k = 1; k <= 10; k++) CC.history.push(ccSnapshot(S, S.time + k * CC.dt));
  if (CC.history.length > CC.max) CC.history.splice(0, CC.history.length - CC.max);
  CC.version++;
}

/** Thyristor designation inside a bridge. */
function ccThyristorId(group, side, phase) {
  return `${group > 0 ? 'P' : 'N'}${side === 0 ? [1, 3, 5][phase] : [4, 6, 2][phase]}`;
}

  .sort((a, b) => (PROTECTION_ORDER.indexOf(a.key) + 1 || 99) - (PROTECTION_ORDER.indexOf(b.key) + 1 || 99));

function defaultSettings() { const o = {}; for (const p of PARAMS) o[p.key] = p.default; return o; }
function paramMax(p, S) { return typeof p.max === 'function' ? p.max(S) : p.max; }

/** Every recorded signal plus the electrical snapshot fields used by drawings. */
function computeSignals(S) {
  const e = computeElectrical(S), out = Object.assign({}, e);
  delete out.cfg;
  for (const d of SIGNALS) out[d.key] = d.value ? d.value(S, e) : e[d.key];
  return out;
}

/** Map of protection key → condition currently present. */
function activeConditions(S) {
  const e = computeElectrical(S), out = {};
  for (const p of PROTECTIONS) out[p.key] = p.active(S, e.cfg, e);
  return out;
}

/** Calls every subsystem's model hooks for one step. */
function stepSubsystems(S, dt) {
  for (const s of SUBSYSTEMS) if (s.before) s.before(S);
  for (const s of SUBSYSTEMS) if (s.step) s.step(S, dt);
}

/* ==========================================================================
 * simulation.js — protections, trend history and the fixed-step loop.
 * Pure model code: no DOM access.
 * ========================================================================== */

/* ---------- protections ---------- */

/* activeConditions() lives in registry.js: protections are declared by subsystems. */

/** Latches one trip and records its exact model-time event. */
function latchTrip(S, reason, startTime) {
  if (S.tripped) return;
  S.tripped = true; S.tripReason = reason; S.run = false;
  S.events.push({ time: S.time, reason, startTime, delay: TRIP_DELAY });
  S.timers = {};
}

/** Advances independent continuous-condition timers; cleared conditions reset their timers. */
function updateProtections(S, dt) {
  if (!S.run || S.tripped) { S.timers = {}; return; }
  const active = activeConditions(S);
  for (const key of Object.keys(active)) {
    if (!active[key]) { delete S.timers[key]; continue; }
    if (!S.timers[key]) S.timers[key] = { elapsed: 0, startTime: S.time - dt };
    S.timers[key].elapsed += dt;
    if (S.timers[key].elapsed + 1e-10 >= TRIP_DELAY) { latchTrip(S, key, S.timers[key].startTime); return; }
  }
}

/** The most advanced pending condition, for display. */
function pendingTrip(S) {
  let best = null;
  for (const key of Object.keys(S.timers)) {
    const t = S.timers[key];
    if (!best || t.elapsed > best.elapsed) best = { key, elapsed: t.elapsed };
  }
  return best;
}

/** Whether the drive is at standstill with no excitation and no stator current. */
function isAtRest(S) {
  const base = configuration(S.poles).nominal.statorCurrent;
  return Math.abs(S.speed) < 0.05 && S.ir < 0.05 && Math.hypot(S.id, S.iq) < 0.05 * base;
}

/**
 * Trip reset. The trip has already removed all commands, so the latch can be cleared
 * at any time, even while the mill is still coasting. A condition that is still present
 * (for example a feed setting above the limit) trips again one second after the next start.
 * Returns true if a trip was cleared.
 */
function resetTrip(S) {
  if (!S.tripped) return false;
  S.tripped = false; S.tripReason = null; S.timers = {};
  return true;
}

/* ---------- trend history ---------- */

/**
 * Ring-like trend store. Samples are appended; old samples are skipped via
 * `start` and compacted occasionally.
 */
function createHistory() { return { samples: [], start: 0, nextSample: SAMPLE_DT }; }

function addSample(S, H) {
  H.samples.push(Object.assign({ time: S.time }, S.signals));
  const cutoff = S.time - MAX_HISTORY;
  while (H.start + 1 < H.samples.length && H.samples[H.start + 1].time < cutoff) H.start++;
  if (H.start > 5000) { H.samples = H.samples.slice(H.start); H.start = 0; }
  S.events = S.events.filter(e => e.time >= cutoff);
}

function clearHistory(S, H) {
  H.samples = []; H.start = 0; S.events = [];
  H.nextSample = S.time + SAMPLE_DT;
  S.signals = computeSignals(S);
  addSample(S, H);
}

/** First sample index at or after a time (binary search). */
function findHistoryIndex(H, time) {
  let low = H.start, high = H.samples.length;
  while (low < high) { const mid = (low + high) >> 1; if (H.samples[mid].time < time) low = mid + 1; else high = mid; }
  return low;
}

/** Recorded sample closest to a time, or null. */
function nearestSample(H, time) {
  if (H.samples.length <= H.start) return null;
  const i = findHistoryIndex(H, time);
  if (i <= H.start) return H.samples[H.start];
  if (i >= H.samples.length) return H.samples[H.samples.length - 1];
  const a = H.samples[i - 1], b = H.samples[i];
  return Math.abs(a.time - time) <= Math.abs(b.time - time) ? a : b;
}

/* ---------- fixed-step loop ---------- */

/** Advances the model by DT: subsystem hooks in registration order, then protections and recording. */
function advance(S, H) {
  stepSubsystems(S, DT);
  S.time += DT;
  updateProtections(S, DT);
  S.signals = computeSignals(S);
  if (S.time + 1e-9 >= H.nextSample) { addSample(S, H); H.nextSample += SAMPLE_DT; }
}

/** Artificially changes rotor angle while paused, preserving either α/β or d/q currents. */
function setRotorAngle(S, H, degrees) {
  if (!S.paused || !Number.isFinite(degrees)) return;
  const fixed = inversePark(S.id, S.iq, S.poles * S.angle);
  S.angle = wrap(clamp(degrees, 0, 360) * Math.PI / 180, TWO_PI);
  if (S.angleMode === 'stationary') { const t = park(fixed.alpha, fixed.beta, S.poles * S.angle); S.id = t.d; S.iq = t.q; }
  S.torque = S.flux * S.iq;
  S.power = REF_POWER * S.torque * S.speed / NOMINAL_SPEED;
  S.returnPower = S.power < 0 ? -S.power * RETURN_EFFICIENCY : 0;
  S.timers = {};
  clearHistory(S, H);
}

let LANG = 'en';

/* ==========================================================================
 * common.js — palette (read from the CSS tokens), canvas helpers, tooltips.
 * ========================================================================== */

const PALETTE = { sig: {} };
const PALETTE_TOKENS = ['bg', 'red', 'surface', 'surface-2', 'inset', 'line', 'line-strong', 'text', 'muted', 'dim', 'control', 'control-strong',
  'run', 'pending', 'trip', 'steel-1', 'steel-2', 'steel-3', 'copper', 'pole-n', 'pole-s', 'ore-1', 'ore-2', 'ore-3'];
const SIGNAL_TOKENS = ['phaseA', 'phaseB', 'phaseC', 'phaseAlight', 'phaseBlight', 'phaseClight', 'voltage', 'alpha', 'beta', 'd', 'q',
  'rotor', 'stator', 'rotorVoltage', 'flux', 'psi', 'cosPhi', 'power', 'returnPower', 'throughput', 'speed', 'speedRef', 'torque', 'chargeTorque'];

/** Reads every colour token from CSS so canvases and HTML share one palette. */
function loadPalette() {
  const cs = getComputedStyle(document.documentElement);
  for (const t of PALETTE_TOKENS) PALETTE[t.replace(/-(\w)/g, (_, c) => c.toUpperCase())] = cs.getPropertyValue('--' + t).trim();
  for (const t of SIGNAL_TOKENS) PALETTE.sig[t] = cs.getPropertyValue('--sig-' + t).trim();
}
const FONT = '"ABBvoice", "Segoe UI", "Helvetica Neue", Arial, sans-serif';
function font(size, weight) { return `${weight || 400} ${size}px ${FONT}`; }

/** Sizes a canvas for its CSS box and device pixel ratio. Returns {width, height}. */
function resizeCanvas(canvas) {
  const r = canvas.getBoundingClientRect(), ratio = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(r.width * ratio));
  canvas.height = Math.max(1, Math.round(r.height * ratio));
  canvas.getContext('2d').setTransform(ratio, 0, 0, ratio, 0, 0);
  canvas._w = r.width; canvas._h = r.height;
}

function circle(ctx, x, y, r, stroke, width, fill) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, TWO_PI);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
}

function arrow(ctx, x1, y1, x2, y2, color, width = 2.5) {
  const angle = Math.atan2(y2 - y1, x2 - x1), head = 5 + width * 2;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1);

  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - head * Math.cos(angle - Math.PI / 7), y2 - head * Math.sin(angle - Math.PI / 7));
  ctx.lineTo(x2 - head * Math.cos(angle + Math.PI / 7), y2 - head * Math.sin(angle + Math.PI / 7));
  ctx.closePath(); ctx.fill();
}

/** Ring sector between radii for a screen-angle interval (a1 > a2, drawn clockwise in math sense). */
function ringSector(ctx, cx, cy, r1, r2, a1, a2) {
  ctx.beginPath(); ctx.arc(cx, cy, r2, a1, a2, true); ctx.arc(cx, cy, r1, a2, a1, false); ctx.closePath();
}

/** Mixes two hex colours. */
function mix(hexA, hexB, t) {
  const a = parseInt(hexA.slice(1), 16), b = parseInt(hexB.slice(1), 16);
  const ch = (x, s) => (x >> s) & 255;
  const m = s => Math.round(ch(a, s) + (ch(b, s) - ch(a, s)) * t);
  return `rgb(${m(16)},${m(8)},${m(0)})`;
}

/** Red (toward viewer) or blue (away) by sign; intensity by magnitude relative to base. */
function currentColor(current, base) {
  const m = clamp(Math.abs(current) / Math.max(base, 1e-3), 0, 1);
  return mix('#2a2a2a', current >= 0 ? '#ff4b45' : '#3d8bff', m);
}

/** Dot (toward viewer) or cross (away) current symbol. */
function currentSymbol(ctx, x, y, r, current, outline, base) {
  circle(ctx, x, y, r, outline, 0.9, '#0a0a0a');
  if (Math.abs(current) < 0.01 * base) return;
  const color = currentColor(current, base);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = Math.max(1.4, r * 0.28);
  if (current > 0) circle(ctx, x, y, r * 0.42, null, 0, color);
  else { const o = r * 0.42; ctx.beginPath(); ctx.moveTo(x - o, y - o); ctx.lineTo(x + o, y + o); ctx.moveTo(x + o, y - o); ctx.lineTo(x - o, y + o); ctx.stroke(); }
}

/* ---------- hit areas & tooltip ---------- */

function addHit(list, x1, y1, x2, y2, key) { list.push({ x1, y1, x2, y2, key }); }

function distanceToSegment(x, y, l) {
  const dx = l.x2 - l.x1, dy = l.y2 - l.y1, len = dx * dx + dy * dy;
  if (len < 1e-8) return Math.hypot(x - l.x1, y - l.y1);
  const f = clamp(((x - l.x1) * dx + (y - l.y1) * dy) / len, 0, 1);
  return Math.hypot(x - l.x1 - f * dx, y - l.y1 - f * dy);
}

let tooltipEl = null;
function showTooltip(text, x, y, kind) {
  tooltipEl.textContent = text; tooltipEl.className = 'tooltip' + (kind ? ' ' + kind : '');
  tooltipEl.style.display = 'block';
  tooltipEl.style.left = `${clamp(x + 14, 5, window.innerWidth - tooltipEl.offsetWidth - 5)}px`;
  tooltipEl.style.top = `${clamp(y + 14, 5, window.innerHeight - tooltipEl.offsetHeight - 5)}px`;
}
function hideTooltip() { if (tooltipEl) tooltipEl.style.display = 'none'; }

/** Shows the explanation of the nearest registered segment under the pointer. */
function segmentTooltip(event, canvas, list) {
  const r = canvas.getBoundingClientRect(), x = event.clientX - r.left, y = event.clientY - r.top;
  let closest = null, distance = event.pointerType === 'touch' ? 18 : 10;
  for (const line of list) { const d = distanceToSegment(x, y, line); if (d < distance) { distance = d; closest = line; } }

/* ==========================================================================
 * machine.js — the ring motor and mill drawn to scale with the pole count.
 * Mechanical angle θ maps to the screen angle −θ − π/2: 0° at the top,
 * positive rotation counter-clockwise on screen.
 * ========================================================================== */

const machineHits = [];
/* Belt order around one electrical revolution, centres at 30°, 90°, … 330°: [phase, sign]. */
const BELTS = [[1, -1], [0, 1], [2, -1], [1, 1], [0, -1], [2, 1]];
const LIFTERS = 24;

function screenAngle(mech) { return -mech - Math.PI / 2; }
function polar(cx, cy, radius, mech) { const a = screenAngle(mech); return [cx + Math.cos(a) * radius, cy + Math.sin(a) * radius]; }

function drawMachine(canvas, S, layers) {
  const ctx = canvas.getContext('2d'), W = canvas._w, H = canvas._h;
  if (!W || !H) return;
  machineHits.length = 0;
  const sig = S.signals, cfg = configuration(S.poles), base = cfg.nominal.statorCurrent, p = S.poles;
  const cx = W / 2, cy = H / 2, r = Math.min(W, H) * 0.47;

  // background
  const bg = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.25);
  bg.addColorStop(0, '#161616'); bg.addColorStop(1, PALETTE.inset);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // ---- stator frame ----
  const frame = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r);
  frame.addColorStop(0, PALETTE.steel3); frame.addColorStop(0.5, PALETTE.steel1); frame.addColorStop(1, PALETTE.steel3);
  ctx.fillStyle = frame; ringSector(ctx, cx, cy, r * 0.945, r, 0, -TWO_PI + 1e-6); ctx.fill('evenodd');
  circle(ctx, cx, cy, r, PALETTE.lineStrong, 1, null);

  // ---- stator winding belts ----
  const belt1 = r * 0.885, belt2 = r * 0.94;
  const phaseCurrents = [sig.ia, sig.ib, sig.ic], phaseColors = [PALETTE.sig.phaseA, PALETTE.sig.phaseB, PALETTE.sig.phaseC];
  const beltArc = (TWO_PI / (6 * p)) * (belt1 + belt2) / 2;
  for (let k = 0; k < p; k++) {
    for (let j = 0; j < 6; j++) {
      const [phase, sign] = BELTS[j], current = sign * phaseCurrents[phase];
      const e0 = (j * 60) * Math.PI / 180 + TWO_PI * k, m0 = e0 / p, m1 = (e0 + Math.PI / 3) / p;
      ringSector(ctx, cx, cy, belt1, belt2, screenAngle(m0), screenAngle(m1));
      ctx.fillStyle = layers.currents ? currentColor(current, base) : '#5a4231';
      ctx.fill();
      ctx.strokeStyle = layers.currents ? phaseColors[phase] : PALETTE.steel3; ctx.lineWidth = 0.8; ctx.stroke();
      if (layers.currents && beltArc > 13) {
        const [x, y] = polar(cx, cy, (belt1 + belt2) / 2, (m0 + m1) / 2);
        currentSymbol(ctx, x, y, Math.min(beltArc * 0.28, (belt2 - belt1) * 0.36), current, phaseColors[phase], base);
      }
    }
  }
  // stationary 0° reference
  ctx.fillStyle = PALETTE.muted;
  ctx.beginPath(); ctx.moveTo(cx - 5, cy - r - 1); ctx.lineTo(cx + 5, cy - r - 1); ctx.lineTo(cx, cy - r + 7); ctx.closePath(); ctx.fill();

  // ---- air gap ----
  circle(ctx, cx, cy, r * 0.877, '#050505', r * 0.012, null);

  // ---- rotor: shell and poles ----
  const shell1 = r * 0.71, shell2 = r * 0.795;
  const shellGrad = ctx.createRadialGradient(cx, cy, shell1, cx, cy, shell2);
  shellGrad.addColorStop(0, PALETTE.steel2); shellGrad.addColorStop(0.6, PALETTE.steel1); shellGrad.addColorStop(1, PALETTE.steel2);
  ctx.fillStyle = shellGrad; ringSector(ctx, cx, cy, shell1, shell2, 0, -TWO_PI + 1e-6); ctx.fill('evenodd');

  const count = 2 * p, pitch = TWO_PI / count, pole1 = r * 0.8, pole2 = r * 0.868;
  const poleArc = pitch * (pole1 + pole2) / 2;
  const excitation = clamp(S.flux, 0, 1.1) / 1.1;
  const nColor = mix('#303030', PALETTE.poleN, 0.25 + 0.75 * excitation), sColor = mix('#303030', PALETTE.poleS, 0.25 + 0.75 * excitation);
  for (let i = 0; i < count; i++) {
    const centre = S.angle + i * pitch, half = pitch * 0.36, north = i % 2 === 0;
    ringSector(ctx, cx, cy, pole1, pole2, screenAngle(centre - half), screenAngle(centre + half));
    ctx.fillStyle = north ? nColor : sColor; ctx.fill();
    ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 0.8; ctx.stroke();
    if (poleArc > 15) {
      const [x, y] = polar(cx, cy, (pole1 + pole2) / 2, centre);
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = font(Math.min(11, poleArc * 0.42), 600);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(north ? 'N' : 'S', x, y);

        const [x, y] = polar(cx, cy, r * 0.775, centre + side * pitch * 0.45);
        currentSymbol(ctx, x, y, Math.min(5, poleArc * 0.14), (north ? 1 : -1) * side * S.ir, PALETTE.sig.rotor, 1);
      }

    const [x, y] = polar(cx, cy, shell1 + (shell2 - shell1) * 0.5, S.angle);
    circle(ctx, x, y, 3, null, 0, PALETTE.sig.rotor);
  }

  // ---- drum interior, lifters, charge ----
  const ri = r * 0.7;
  circle(ctx, cx, cy, ri, null, 0, '#0b0b0b');
  ctx.fillStyle = PALETTE.steel1;
  for (let i = 0; i < LIFTERS; i++) {
    const a = S.angle + i * TWO_PI / LIFTERS, w = 0.035;
    ctx.beginPath();
    const pts = [[ri, a - w], [ri * 0.94, a - w * 0.6], [ri * 0.94, a + w * 0.6], [ri, a + w]];
    pts.forEach(([rad, ang], n) => { const [x, y] = polar(cx, cy, rad, ang); if (n) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
    ctx.closePath(); ctx.fill();
  }
  if (layers.material) {
    const ores = [PALETTE.ore1, PALETTE.ore2, PALETTE.ore3];
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, ri, 0, TWO_PI); ctx.clip();
    for (const q of S.particles) {
      const x = cx + q.x * ri, y = cy + q.y * ri, rad = q.radius * ri;
      circle(ctx, x, y, rad, null, 0, ores[q.tone]);
      circle(ctx, x - rad * 0.3, y - rad * 0.3, rad * 0.35, null, 0, 'rgba(255,255,255,.18)');
    }

  }

  // ---- field axes ----
  if (layers.fields) {
    const theta = p * S.angle, mag = Math.hypot(sig.alpha, sig.beta);
    const currentAngle = mag > 1e-8 ? Math.atan2(sig.beta, sig.alpha) : theta;
    const statorMech = S.angle + wrapPi(currentAngle - theta) / p;
    const rotorLength = r * 0.5 * clamp(S.flux / 1.5, 0, 1), statorLength = r * 0.6 * clamp(mag / (base * 1.5), 0, 1);
    circle(ctx, cx, cy, 4, null, 0, PALETTE.muted);
    if (rotorLength > 3) { const [x, y] = polar(cx, cy, rotorLength, S.angle); arrow(ctx, cx, cy, x, y, PALETTE.sig.rotor, 3); addHit(machineHits, cx, cy, x, y, 'rotorAxis'); }
